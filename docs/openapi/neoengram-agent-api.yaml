openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: NeoEngram Agent API
  version: 0.0.1
  summary: Agent-initiated action API for enrollment, sessions, Jobs, Index and Manifest pages, and metadata
  description: |
    Contract for the independent Agent listener. Every operation is an action-style POST and all
    resource identities are carried in the JSON body. This API is not exposed by the public Web
    listener.

    Authentication is carried inside each JSON request. OpenAPI 3.1 Security Scheme Objects cannot
    describe a body-carried bootstrap token or Ed25519 proof, so every operation intentionally uses
    `security: []` and names its application-layer scheme through `x-neoengram-body-security`.
    This does not mean that an operation is unauthenticated.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: http://127.0.0.1:8081
    description: Loopback development Agent listener
tags:
  - name: Enrollment
    description: One-time enrollment bootstrap and signed approval-status query operations
  - name: Session
    description: Signed HTTP/2 control channel, session lifecycle, and compatibility recovery operations
  - name: Job
    description: Signed Job report, metadata, and authoritative Index and Manifest operations; object bytes stay on the Volume
x-neoengram-body-security-schemes:
  BootstrapTokenAndEd25519:
    description: >-
      A one-time bootstrap token and installation Ed25519 proof are required in the JSON body.
  InstallationEd25519:
    description: >-
      The installation Ed25519 proof is required in the JSON body when querying enrollment status.
  ApprovedAgentEd25519:
    description: >-
      An approved Agent Ed25519 proof is required in the JSON body and binds POST, canonical path,
      Agent, installation, boot and optional session identities, request ID, timestamp, and the
      BLAKE3 digest of the unsigned RFC 8785 canonical JSON body.
  ApprovedAgentEd25519PerFrame:
    description: >-
      Every upstream NDJSON frame carries an independent approved-Agent Ed25519 proof. The proof
      binds POST, /agent/session/channel/open, Agent, installation, boot and optional session
      identities, request ID, timestamp, sequence, message ID, correlation, frame type, and the
      complete frame payload through the BLAKE3 digest of the unsigned RFC 8785 canonical JSON body.
paths:
  /agent/enrollment/bootstrap:
    post:
      operationId: bootstrapAgentEnrollment
      tags: [Enrollment]
      summary: Bootstrap Agent enrollment
      description: >-
        Consumes a one-time bootstrap token and verifies the installation Ed25519 proof before
        durably creating or replaying the pending enrollment.
      security: []
      x-neoengram-body-security: BootstrapTokenAndEd25519
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBootstrapRequest'
      responses:
        '200':
          description: Bootstrap was durably accepted or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBootstrapAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /agent/enrollment/status/query:
    post:
      operationId: queryAgentEnrollmentStatus
      tags: [Enrollment]
      summary: Query Agent enrollment status
      description: >-
        Verifies the installation Ed25519 proof and returns the current approval state for the
        exact enrollment request identity without consuming another bootstrap token.
      security: []
      x-neoengram-body-security: InstallationEd25519
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBootstrapStatusRequest'
      responses:
        '200':
          description: Current bootstrap approval state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Problem'
  /agent/session/open:
    post:
      operationId: openAgentSession
      tags: [Session]
      summary: Open an Agent session
      description: >-
        Verifies the approved Agent proof and opens or exactly replays the durable session identity
        for the supplied boot, advancing the session generation only for a valid takeover.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/SessionOpen'
      responses:
        '200':
          description: Durable session identity and generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionOpenResponse'
        default:
          $ref: '#/components/responses/Problem'
  /agent/session/channel/open:
    post:
      operationId: openAgentSessionChannel
      tags: [Session]
      summary: Open an HTTP/2 Agent session channel
      description: >-
        Opens one Agent-initiated HTTP/2 full-duplex control channel. Both directions carry
        LF-delimited JSON frames; HTTP/2 DATA frame boundaries have no application meaning. The
        first upstream frame must be a signed channel.open and the first downstream frame is its
        correlated channel.opened response. Later upstream frames remain independently signed and
        session-fenced; assignments and decisions are delivered on the downstream stream.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519PerFrame
      x-neoengram-http2-duplex:
        transport: http2-full-duplex
        primaryControlTransport: true
        mediaType: application/x-ndjson
        h2DataFrameBoundaries: ignored
        frameDelimiter: LF
        maxFrameBytes: 1048576
        delimiterExcludedFromFrameBytes: true
        finalFrameRequiresDelimiter: true
        firstUpstreamFrameType: channel.open
        firstDownstreamFrameType: channel.opened
        upstreamAuthentication: body-carried-ed25519-proof-per-frame
      requestBody:
        required: true
        description: >-
          Streaming request body containing AgentChannelUpstreamFrame records. One logical record is
          one JSON object followed by LF; the schema describes each record, not an H2 DATA frame.
        content:
          application/x-ndjson:
            schema:
              $ref: '#/components/schemas/AgentChannelUpstreamFrame'
      responses:
        '200':
          description: >-
            Streaming response body containing AgentChannelDownstreamFrame records until either side
            closes the channel or a terminal transport/protocol error occurs.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AgentChannelDownstreamFrame'
        default:
          $ref: '#/components/responses/Problem'
  /agent/session/heartbeat/report:
    post:
      operationId: reportAgentSessionHeartbeat
      tags: [Session]
      summary: Report Agent session heartbeat
      description: >-
        Applies the signed heartbeat and mount observation only when the session identity and
        generation are current, updating the bound Volume health idempotently.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/HeartbeatReport'
      responses:
        '200':
          description: Heartbeat and mount observation were applied idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeatReportResponse'
        default:
          $ref: '#/components/responses/Problem'
  /agent/session/message/list/query:
    post:
      operationId: queryAgentSessionMessages
      tags: [Session]
      summary: Recover deliverable session messages through the compatibility action
      description: >-
        Compatibility and manual-recovery action only; the primary Agent runtime receives
        assignments and decisions through the HTTP/2 full-duplex channel. When explicitly invoked,
        this action short-polls up to 32 messages for the fenced session and an empty result asks the
        caller to retry after 1000 milliseconds.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      x-neoengram-compatibility-only: true
      requestBody:
        $ref: '#/components/requestBodies/MessageListQuery'
      responses:
        '200':
          description: Assignments and decisions currently deliverable to this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageListQueryResponse'
        default:
          $ref: '#/components/responses/Problem'
  /agent/job/report/create:
    post:
      operationId: createAgentJobReport
      tags: [Job]
      summary: Create a durable Agent Job report
      description: >-
        Accepts or idempotently replays an ordered Accepted, Progress, Prepared, Failed, or Finalized
        report from the currently fenced Agent session.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/JobReportCreate'
      responses:
        '200':
          $ref: '#/components/responses/ActionAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /agent/job/metadata/batch/stage:
    post:
      operationId: stageAgentJobMetadataBatch
      tags: [Job]
      summary: Stage a Job metadata batch descriptor
      description: >-
        Validates Job and Tenant scope and idempotently stages one Manifest, IndexDelta, or
        ObjectReceipt MetadataBatch descriptor before its pages are accepted.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/MetadataBatchStage'
      responses:
        '200':
          $ref: '#/components/responses/MetadataStaged'
        default:
          $ref: '#/components/responses/Problem'
  /agent/job/metadata/page/stage:
    post:
      operationId: stageAgentJobMetadataPage
      tags: [Job]
      summary: Stage a Job metadata batch page
      description: >-
        Validates the descriptor-bound page number, size, digest, Job scope, and session fence before
        idempotently staging the MetadataBatch page.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/MetadataPageStage'
      responses:
        '200':
          $ref: '#/components/responses/MetadataStaged'
        default:
          $ref: '#/components/responses/Problem'
  /agent/job/index/page/query:
    post:
      operationId: queryAgentJobIndexPage
      tags: [Job]
      summary: Query an authoritative Job Index page
      description: >-
        Returns one immutable page of the exact Index version authorized by the Assignment after
        validating Agent, Job, Artifact, Playground, and Tenant scope.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/IndexPageQuery'
      responses:
        '200':
          description: One immutable page of the requested Index version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentIndexPageQueryResponse'
        default:
          $ref: '#/components/responses/Problem'
  /agent/job/manifest/page/query:
    post:
      operationId: queryAgentJobManifestPage
      tags: [Job]
      summary: Query an authoritative Job Manifest page
      description: >-
        Returns one immutable page of Manifest chunk references authorized by the Assignment after
        validating Agent, Job, Artifact, Manifest, and Tenant scope. The response contains metadata
        only; immutable object payload bytes remain on the user Volume.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/ManifestPageQuery'
      responses:
        '200':
          description: One immutable page of the requested Manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifestPageQueryResponse'
        default:
          $ref: '#/components/responses/Problem'
  /agent/session/close:
    post:
      operationId: closeAgentSession
      tags: [Session]
      summary: Close an Agent session
      description: >-
        Fences the exact current session closed and advances its durable state so later requests from
        the closed generation are rejected.
      security: []
      x-neoengram-body-security: ApprovedAgentEd25519
      requestBody:
        $ref: '#/components/requestBodies/SessionClose'
      responses:
        '200':
          description: Session was fenced closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionCloseResponse'
        default:
          $ref: '#/components/responses/Problem'
components:
  requestBodies:
    SessionOpen:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SignedAgentRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentSessionOpenPayload'
    HeartbeatReport:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentHeartbeatReportPayload'
    MessageListQuery:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentMessageListQueryPayload'
    JobReportCreate:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentJobReportCreatePayload'
    MetadataBatchStage:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentMetadataBatchStagePayload'
    MetadataPageStage:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentMetadataPageStagePayload'
    IndexPageQuery:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentIndexPageQueryPayload'
    ManifestPageQuery:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentManifestPageQueryPayload'
    SessionClose:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EstablishedSessionRequest'
              - type: object
                properties:
                  payload:
                    $ref: '#/components/schemas/AgentSessionClosePayload'
  responses:
    ActionAccepted:
      description: Action was applied or replayed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentActionAcceptedResponse'
    MetadataStaged:
      description: Metadata material was staged idempotently.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentMetadataStageResponse'
    Problem:
      description: Sanitized Agent API problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,127})$'
    DecimalU64:
      $ref: '../../crates/neoengram-protocol/schemas/v1/control-envelope.schema.json#/$defs/DecimalU64'
    PositiveDecimalU64:
      $ref: '../../crates/neoengram-protocol/schemas/v1/control-envelope.schema.json#/$defs/SessionGeneration'
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    AgentRequestProof:
      type: object
      required: [unsigned_body_digest, algorithm, public_key_spki, signature]
      properties:
        unsigned_body_digest:
          $ref: '#/components/schemas/Digest'
        algorithm:
          const: ed25519
        public_key_spki:
          $ref: '../../crates/neoengram-protocol/schemas/v1/agent-enrollment.schema.json#/$defs/Ed25519PublicKeySpki'
        signature:
          $ref: '../../crates/neoengram-protocol/schemas/v1/agent-enrollment.schema.json#/$defs/Ed25519Signature'
    SignedAgentRequest:
      type: object
      required:
        - protocol_version
        - request_id
        - agent_id
        - installation_id
        - boot_id
        - signed_at_unix_ms
        - payload
        - proof
      properties:
        protocol_version:
          const: 1
        request_id:
          $ref: '#/components/schemas/Id'
        agent_id:
          $ref: '#/components/schemas/Id'
        installation_id:
          $ref: '#/components/schemas/Id'
        boot_id:
          $ref: '#/components/schemas/Id'
        signed_at_unix_ms:
          $ref: '#/components/schemas/DecimalU64'
        payload:
          type: object
        proof:
          $ref: '#/components/schemas/AgentRequestProof'
    EstablishedSessionRequest:
      allOf:
        - $ref: '#/components/schemas/SignedAgentRequest'
        - type: object
          required: [session_id, session_generation]
          properties:
            session_id:
              $ref: '#/components/schemas/Id'
            session_generation:
              $ref: '#/components/schemas/PositiveDecimalU64'
    AgentChannelUpstreamFrame:
      description: One independently signed Agent-to-Server JSON record, limited to 1048576 encoded bytes before its mandatory LF delimiter.
      oneOf:
        - $ref: '#/components/schemas/AgentChannelOpenFrame'
        - $ref: '#/components/schemas/AgentChannelHeartbeatFrame'
        - $ref: '#/components/schemas/AgentChannelReportFrame'
        - $ref: '#/components/schemas/AgentChannelCloseFrame'
    AgentChannelUpstreamPayloadBase:
      type: object
      required: [sequence, message_id, type, payload]
      properties:
        sequence:
          $ref: '#/components/schemas/PositiveDecimalU64'
        message_id:
          $ref: '#/components/schemas/Id'
        correlation_id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
        payload:
          type: object
    AgentChannelOpenFrame:
      allOf:
        - $ref: '#/components/schemas/SignedAgentRequest'
        - type: object
          required: [payload]
          properties:
            session_id: false
            session_generation: false
            payload:
              allOf:
                - $ref: '#/components/schemas/AgentChannelUpstreamPayloadBase'
                - type: object
                  properties:
                    correlation_id: false
                    sequence:
                      const: '1'
                    type:
                      const: channel.open
                    payload:
                      $ref: '#/components/schemas/AgentSessionOpenPayload'
    AgentChannelHeartbeatFrame:
      allOf:
        - $ref: '#/components/schemas/EstablishedSessionRequest'
        - type: object
          required: [payload]
          properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/AgentChannelUpstreamPayloadBase'
                - type: object
                  properties:
                    type:
                      const: session.heartbeat
                    payload:
                      $ref: '#/components/schemas/AgentHeartbeatReportPayload'
    AgentChannelReportFrame:
      allOf:
        - $ref: '#/components/schemas/EstablishedSessionRequest'
        - type: object
          required: [payload]
          properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/AgentChannelUpstreamPayloadBase'
                - type: object
                  properties:
                    type:
                      const: job.report
                    payload:
                      $ref: '#/components/schemas/AgentJobReportCreatePayload'
    AgentChannelCloseFrame:
      allOf:
        - $ref: '#/components/schemas/EstablishedSessionRequest'
        - type: object
          required: [payload]
          properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/AgentChannelUpstreamPayloadBase'
                - type: object
                  properties:
                    type:
                      const: channel.close
                    payload:
                      $ref: '#/components/schemas/AgentSessionClosePayload'
    AgentChannelDownstreamFrame:
      description: One Server-to-Agent JSON record, limited to 1048576 encoded bytes before its mandatory LF delimiter.
      oneOf:
        - $ref: '#/components/schemas/AgentChannelOpenedFrame'
        - $ref: '#/components/schemas/AgentChannelAssignmentFrame'
        - $ref: '#/components/schemas/AgentChannelDecisionFrame'
        - $ref: '#/components/schemas/AgentChannelAckFrame'
        - $ref: '#/components/schemas/AgentChannelErrorFrame'
      discriminator:
        propertyName: type
        mapping:
          channel.opened: '#/components/schemas/AgentChannelOpenedFrame'
          job.assignment: '#/components/schemas/AgentChannelAssignmentFrame'
          job.decision: '#/components/schemas/AgentChannelDecisionFrame'
          channel.ack: '#/components/schemas/AgentChannelAckFrame'
          protocol.error: '#/components/schemas/AgentChannelErrorFrame'
    AgentChannelDownstreamBase:
      type: object
      required:
        - protocol_version
        - sequence
        - message_id
        - session_generation
        - sent_at_unix_ms
        - type
        - payload
      properties:
        protocol_version:
          const: 1
        sequence:
          $ref: '#/components/schemas/PositiveDecimalU64'
        message_id:
          $ref: '#/components/schemas/Id'
        correlation_id:
          $ref: '#/components/schemas/Id'
        session_generation:
          $ref: '#/components/schemas/PositiveDecimalU64'
        sent_at_unix_ms:
          $ref: '#/components/schemas/DecimalU64'
        type:
          type: string
        payload:
          type: object
    AgentChannelOpenedFrame:
      allOf:
        - $ref: '#/components/schemas/AgentChannelDownstreamBase'
        - type: object
          required: [correlation_id]
          properties:
            sequence:
              const: '1'
            type:
              const: channel.opened
            payload:
              $ref: '#/components/schemas/AgentSessionOpenResponse'
    AgentChannelAssignmentFrame:
      allOf:
        - $ref: '#/components/schemas/AgentChannelDownstreamBase'
        - type: object
          properties:
            correlation_id: false
            type:
              const: job.assignment
            payload:
              $ref: '#/components/schemas/AgentChannelJobAssignment'
    AgentChannelDecisionFrame:
      allOf:
        - $ref: '#/components/schemas/AgentChannelDownstreamBase'
        - type: object
          properties:
            correlation_id: false
            type:
              const: job.decision
            payload:
              $ref: '#/components/schemas/AgentChannelJobDecision'
    AgentChannelAckFrame:
      allOf:
        - $ref: '#/components/schemas/AgentChannelDownstreamBase'
        - type: object
          required: [correlation_id]
          properties:
            type:
              const: channel.ack
            payload:
              $ref: '#/components/schemas/AgentChannelAck'
    AgentChannelErrorFrame:
      allOf:
        - $ref: '#/components/schemas/AgentChannelDownstreamBase'
        - type: object
          properties:
            type:
              const: protocol.error
            payload:
              $ref: '#/components/schemas/AgentChannelControlError'
    AgentChannelAck:
      type: object
      required: [acknowledged_sequence, resource_version, replayed]
      properties:
        acknowledged_sequence:
          $ref: '#/components/schemas/PositiveDecimalU64'
        resource_version:
          $ref: '#/components/schemas/DecimalU64'
        replayed:
          type: boolean
    AgentChannelJobAssignment:
      $ref: '../../crates/neoengram-protocol/schemas/v1/control-envelope.schema.json#/$defs/JobAssignment'
    AgentChannelJobDecision:
      $ref: '../../crates/neoengram-protocol/schemas/v1/control-envelope.schema.json#/$defs/JobDecision'
    AgentChannelControlError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 96
          pattern: '^[A-Z][A-Z0-9_]{0,95}$'
        message:
          type: string
          minLength: 1
          maxLength: 4096
        retryable:
          type: boolean
        retry_after_ms:
          $ref: '#/components/schemas/DecimalU64'
    AgentSessionOpenPayload:
      type: object
      required: [mount_identity_digest, expected_resource_version]
      properties:
        mount_identity_digest:
          $ref: '#/components/schemas/Digest'
        expected_resource_version:
          $ref: '#/components/schemas/DecimalU64'
    AgentSessionOpenResponse:
      type: object
      required: [protocol_version, request_id, agent_id, session_id, session_generation, agent_mount_id, mount_generation, owner_generation, resource_version, opened_at_unix_ms, replayed]
      properties:
        protocol_version: { const: 1 }
        request_id: { $ref: '#/components/schemas/Id' }
        agent_id: { $ref: '#/components/schemas/Id' }
        session_id: { $ref: '#/components/schemas/Id' }
        session_generation: { $ref: '#/components/schemas/PositiveDecimalU64' }
        agent_mount_id: { $ref: '#/components/schemas/Id' }
        mount_generation: { $ref: '#/components/schemas/PositiveDecimalU64' }
        owner_generation: { $ref: '#/components/schemas/PositiveDecimalU64' }
        resource_version: { $ref: '#/components/schemas/DecimalU64' }
        opened_at_unix_ms: { $ref: '#/components/schemas/DecimalU64' }
        replayed: { type: boolean }
    AgentHeartbeatReportPayload:
      type: object
      required: [heartbeat, mount_report]
      properties:
        heartbeat:
          $ref: '../../crates/neoengram-protocol/schemas/v1/control-envelope.schema.json#/$defs/AgentHeartbeat'
        mount_report:
          $ref: '../../crates/neoengram-protocol/schemas/v1/agent-enrollment.schema.json#/$defs/AgentMountStatusReport'
    AgentHeartbeatReportResponse:
      type: object
      required: [protocol_version, request_id, resource_version, received_at_unix_ms, replayed]
      properties:
        protocol_version: { const: 1 }
        request_id: { $ref: '#/components/schemas/Id' }
        resource_version: { $ref: '#/components/schemas/DecimalU64' }
        received_at_unix_ms: { $ref: '#/components/schemas/DecimalU64' }
        replayed: { type: boolean }
    AgentMessageListQueryPayload:
      type: object
      required: [max_messages]
      properties:
        max_messages: { type: integer, minimum: 1, maximum: 32 }
    AgentMessageListQueryResponse:
      type: object
      required: [protocol_version, request_id, messages, retry_after_ms]
      properties:
        protocol_version: { const: 1 }
        request_id: { $ref: '#/components/schemas/Id' }
        messages:
          type: array
          maxItems: 32
