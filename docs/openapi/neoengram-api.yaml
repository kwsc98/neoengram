        expires_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    DeletionOperationView:
      type: object
      description: 固定依赖批次的持久化安全删除 Saga；进入 `purging` 后不可恢复。
      additionalProperties: false
      required:
        - deletion_id
        - tenant_id
        - root
        - state
        - resource_version
        - targets
        - request_id
        - request_digest
        - impact_digest
        - cascade
        - confirm_managed_data_erase
        - purge_after_unix_ms
        - created_at_unix_ms
        - updated_at_unix_ms
        - retry_count
      properties:
        deletion_id:
          $ref: "#/components/schemas/DeletionId"
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        root:
          $ref: "#/components/schemas/ResourceRef"
        state:
          $ref: "#/components/schemas/DeletionOperationState"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        targets:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/DeletionTargetView"
        request_id:
          $ref: "#/components/schemas/RequestId"
        request_digest:
          $ref: "#/components/schemas/ContentDigest"
        impact_digest:
          $ref: "#/components/schemas/ContentDigest"
        cascade:
          type: boolean
        confirm_managed_data_erase:
          type: boolean
        purge_after_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        completion:
          $ref: "#/components/schemas/DeletionCompletion"
        last_error:
          type: string
          minLength: 1
          maxLength: 4096
        resume_state:
          allOf:
            - $ref: "#/components/schemas/DeletionOperationState"
          description: |
            `blocked` 或 `failed` 操作的持久化恢复点。重试会返回此阶段；`restoring`
            表示继续恢复，其余可恢复阶段表示继续删除。非错误状态不返回该字段。
        retry_count:
          $ref: "#/components/schemas/CanonicalU64"

