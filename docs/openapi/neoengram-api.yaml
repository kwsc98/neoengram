components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        由部署配置的 OIDC issuer 签发。服务端从验证后的 issuer/sub 映射 PrincipalRef，
        tenant scope 只能由启动时加载的服务端 RBAC 策略授予。JWT 中的 tenant、role、group
        只能作为审计提示；token 或请求体中的身份提示都不能覆盖服务端授权结果。

  parameters:
    ApiVersion:
      name: NeoEngram-API-Version
      in: header
      required: true
      description: 公开 API 主版本；不兼容演进不改变 path。
      schema:
        type: string
        enum: ["1"]
      example: "1"
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        可选的调用方请求 ID。缺失时由服务端生成；无论来源如何，响应都必须回传最终 ID。
      schema:
        $ref: "#/components/schemas/RequestId"
      example: req-20260727-001
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context traceparent。
      schema:
        type: string
        minLength: 55
        maxLength: 512
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01

  headers:
    RequestId:
      required: true
      description: 服务端确认或生成的请求 ID。
      schema:
        $ref: "#/components/schemas/RequestId"
      example: req-20260727-001

  responses:
    AuthenticationProblem:
      description: Bearer token 缺失、无效或已过期
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:authentication-required
            title: Authentication required
            status: 401
            detail: A valid Bearer token is required
            instance: /api/task/query
            code: AUTHENTICATION_REQUIRED
            request_id: req-20260727-001
            retryable: false
    AuthorizationProblem:
      description: principal 无权执行当前方法
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:authorization-denied
            title: Authorization denied
            status: 403
            detail: The principal is not authorized for this operation
            instance: /api/task/cancel
            code: AUTHORIZATION_DENIED
            request_id: req-20260727-001
            retryable: false
    ResourceNotFoundProblem:
      description: 资源不存在，或对当前 principal 不可见
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            tenantNotFound:
              value:
                type: urn:neoengram:problem:tenant-not-found
                title: Tenant not found
                status: 404
                detail: The requested Tenant was not found
                instance: /api/tenant/query
                code: TENANT_NOT_FOUND
                request_id: req-20260727-001
                retryable: false
            artifactNotFound:
              value:
                type: urn:neoengram:problem:artifact-not-found
                title: Artifact not found
                status: 404
                detail: The requested Artifact was not found
                instance: /api/artifact/query
                code: ARTIFACT_NOT_FOUND
                request_id: req-20260727-001
                retryable: false
    StorageEnrollmentNotFoundProblem:
      description: Storage enrollment 不存在，或不属于当前认证 principal 可见的 Tenant
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:storage-enrollment-not-found
            title: Storage enrollment not found
            status: 404
            detail: The requested Storage enrollment was not found
            instance: /api/storage/enrollment/query
            code: STORAGE_ENROLLMENT_NOT_FOUND
            request_id: req-20260731-001
            retryable: false
    TenantConflictProblem:
      description: Tenant ID 已绑定另一份创建内容
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:tenant-id-reused
            title: Tenant ID reused
            status: 409
            detail: The Tenant ID already belongs to a different create request
            instance: /api/tenant/create
            code: TENANT_ID_REUSED
            request_id: req-20260727-001
            retryable: false
    MutationConflictProblem:
      description: 资源 identity 已绑定另一创建内容，或 expected version 不再匹配
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            resourceConflict:
              value:
                type: urn:neoengram:problem:resource-conflict
                title: Resource mutation conflict
                status: 409
                detail: The resource identity or expected version conflicts with current state
                instance: /api/workspace/commit/create
                code: RESOURCE_CONFLICT
                request_id: req-20260727-001
                retryable: false
            hardlinkRequiresWholeFile:
              value:
                type: urn:neoengram:problem:hardlink-requires-whole-file
                title: Hardlink delivery requires WholeFile layout
                status: 409
                detail: Hardlink delivery is only available for a WholeFile Commit
                instance: /api/snapshot/create
                code: HARDLINK_REQUIRES_WHOLE_FILE
                request_id: req-20260727-002
                retryable: false
            hardlinkCrossFilesystem:
              value:
                type: urn:neoengram:problem:hardlink-cross-filesystem
                title: Hardlink delivery crosses filesystems
                status: 409
                detail: The CAS object and delivery target are on different filesystems
                instance: /api/snapshot/create
                code: HARDLINK_CROSS_FILESYSTEM
                request_id: req-20260727-003
                retryable: false
            hardlinkUnsafeVolume:
              value:
                type: urn:neoengram:problem:hardlink-unsafe-volume
                title: Hardlink delivery is unsafe on this volume
                status: 409
                detail: The StorageVolume policy does not provide a sealed read-only hardlink boundary
                instance: /api/snapshot/create
                code: HARDLINK_UNSAFE_VOLUME
                request_id: req-20260727-004
                retryable: false
            hardlinkObjectNotSealed:
              value:
                type: urn:neoengram:problem:hardlink-object-not-sealed
                title: Hardlink object is not sealed
                status: 409
                detail: The referenced CAS object is not sealed for hardlink delivery
                instance: /api/snapshot/create
                code: HARDLINK_OBJECT_NOT_SEALED
                request_id: req-20260727-005
                retryable: false
            deliveryTargetConflict:
              value:
                type: urn:neoengram:problem:delivery-target-conflict
                title: Delivery target conflict
                status: 409
                detail: The derived delivery target is already occupied by another resource
                instance: /api/snapshot/create
                code: DELIVERY_TARGET_CONFLICT
                request_id: req-20260727-006
                retryable: false
    StorageEnrollmentConflictProblem:
      description: enrollment identity、状态、绑定或 expected resource version 与当前权威状态冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            staleResourceVersion:
              value:
                type: urn:neoengram:problem:storage-enrollment-version-conflict
                title: Storage enrollment version conflict
                status: 409
                detail: The Storage enrollment resource version changed before review
                instance: /api/storage/enrollment/approve
                code: STORAGE_ENROLLMENT_VERSION_CONFLICT
                request_id: req-20260731-001
                retryable: false
            tokenRequestIdentityReused:
              value:
                type: urn:neoengram:problem:storage-enrollment-token-request-id-reused
                title: Storage enrollment token request ID reused
                status: 409
                detail: The token request ID already belongs to a different payload
                instance: /api/storage/enrollment/token/create
                code: STORAGE_ENROLLMENT_TOKEN_REQUEST_ID_REUSED
                request_id: req-20260731-002
                retryable: false
            decisionRequestIdentityReused:
              value:
                type: urn:neoengram:problem:storage-enrollment-decision-id-reused
                title: Storage enrollment decision request ID reused
                status: 409
                detail: The decision request ID already belongs to another review action or payload
                instance: /api/storage/enrollment/reject
                code: STORAGE_ENROLLMENT_DECISION_ID_REUSED
                request_id: req-20260731-003
                retryable: false
            pvcAlreadyEnrolled:
              value:
                type: urn:neoengram:problem:pvc-already-enrolled
                title: PVC already enrolled
                status: 409
                detail: The PVC is already bound to another active Agent enrollment
                instance: /api/storage/enrollment/approve
                code: PVC_ALREADY_ENROLLED
                request_id: req-20260731-003
                retryable: false
            replacementConfirmationRequired:
              value:
                type: urn:neoengram:problem:storage-enrollment-replacement-confirmation-required
                title: Replacement confirmation required
                status: 409
                detail: Replacement enrollment approval requires explicit confirmation
                instance: /api/storage/enrollment/approve
                code: STORAGE_ENROLLMENT_REPLACEMENT_CONFIRMATION_REQUIRED
                request_id: req-20260731-004
                retryable: false
            descriptorMismatch:
              value:
                type: urn:neoengram:problem:storage-volume-descriptor-mismatch
                title: StorageVolume descriptor mismatch
                status: 409
                detail: The enrollment probe does not match the descriptor frozen by the bootstrap token
                instance: /api/storage/enrollment/approve
                code: STORAGE_VOLUME_DESCRIPTOR_MISMATCH
                request_id: req-20260731-005
                retryable: false
    CursorConflictProblem:
      description: Cursor 无效、已过期或与当前 scope/filter 不匹配
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:cursor-invalid
            title: Cursor is invalid
            status: 409
            detail: The cursor is invalid or does not match the current query
            instance: /api/artifact/commit/graph/query
            code: CURSOR_INVALID
            request_id: req-20260727-001
            retryable: false
    PayloadTooLargeProblem:
      description: 请求编码字节数超过当前方法上限
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:payload-too-large
            title: Payload too large
            status: 413
            detail: The encoded request exceeds the method limit
            instance: /api/task/list/query
            code: PROTOCOL_LIMIT_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    ValidationProblem:
      description: 请求 header、protocol 或 metadata 违反公开契约
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unsupportedApiVersion:
              summary: API 主版本不受支持
              value:
                type: urn:neoengram:problem:api-version-unsupported
                title: API version is unsupported
                status: 422
                detail: NeoEngram-API-Version must be 1
                instance: /api/task/query
                code: API_VERSION_UNSUPPORTED
                request_id: req-20260727-001
                retryable: false
                violations:
                  - field: NeoEngram-API-Version
                    reason: unsupported value
            invalidPathSelection:
              summary: Task 筛选条件无效
              value:
                type: urn:neoengram:problem:protocol-invalid
                title: Request validation failed
                status: 422
                detail: task filters must contain a supported scope
                instance: /api/task/list/query
                code: PROTOCOL_INVALID
                request_id: req-20260727-001
                retryable: false
                violations:
                  - field: intent_kind
                    reason: contains an unsupported task intent
    OverloadedProblem:
      description: 服务端并发请求配额已耗尽
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:overloaded
            title: Resource exhausted
            status: 429
            detail: server request concurrency is exhausted
            instance: /api/task/list/query
            code: OVERLOADED
            request_id: req-20260727-001
            retryable: false
    RequestTimeoutProblem:
      description: 请求超过服务端处理时限
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:deadline-exceeded
            title: Request deadline exceeded
            status: 504
            detail: service invocation deadline elapsed
            instance: /api/task/query
            code: DEADLINE_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    InternalProblem:
      description: 未分类的服务端内部错误
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:internal
            title: Internal error
            status: 500
            detail: The server could not complete the request
            instance: /api/task/query
            code: INTERNAL
            request_id: req-20260727-001
            retryable: true
    ServiceUnavailableProblem:
      description: authority 或必要依赖暂不可用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:storage-failure
            title: Authority unavailable
            status: 503
            detail: The authority store is temporarily unavailable
            instance: /health/ready
            code: STORAGE_FAILURE
            request_id: req-20260727-001
            retryable: true
            retry_after_ms: "1000"

  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false

    ApiVersionResponse:
      type: object
      additionalProperties: false
      required:
        - api_version
        - agent_wire_version
        - capabilities
      properties:
        api_version:
          type: integer
          enum: [1]
        agent_wire_version:
          type: integer
          enum: [1]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[a-z][a-z0-9_]{0,127}$"

    CreateGatewayPoolRequest:
      type: object
      additionalProperties: false
      required:
        - gateway_pool_id
        - edge_cluster_id
        - display_name
        - agent_endpoint
        - desired_replicas
        - minimum_ready_replicas
      properties:
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        agent_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        s3_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        desired_replicas:
          $ref: "#/components/schemas/GatewayReplicaCount"
        minimum_ready_replicas:
          $ref: "#/components/schemas/GatewayReplicaCount"

    QueryGatewayPoolRequest:
      type: object
      additionalProperties: false
      required: [gateway_pool_id]
      properties:
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"

    QueryGatewayPoolListRequest:
      type: object
      additionalProperties: false
      properties:
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        state:
          $ref: "#/components/schemas/GatewayPoolState"
        after:
          $ref: "#/components/schemas/GatewayPoolId"
        page_size:
          type: integer
          minimum: 1
          maximum: 255

    UpdateGatewayPoolRequest:
      type: object
      additionalProperties: false
      required: [gateway_pool_id, expected_resource_version]
      properties:
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        agent_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        s3_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        clear_s3_endpoint:
          type: boolean
        desired_replicas:
          $ref: "#/components/schemas/GatewayReplicaCount"
        minimum_ready_replicas:
          $ref: "#/components/schemas/GatewayReplicaCount"
        state:
          type: string
          enum: [provisioning, ready, disabled]

    DrainGatewayPoolRequest:
      type: object
      additionalProperties: false
      required: [gateway_pool_id, expected_resource_version]
      properties:
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"

    GatewayPoolResponse:
      type: object
      additionalProperties: false
      required: [gateway_pool, request_replayed, execution_reused]
      properties:
        gateway_pool:
          $ref: "#/components/schemas/GatewayPoolView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    GatewayPoolListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 255
          items:
            $ref: "#/components/schemas/GatewayPoolView"
        next_after:
          $ref: "#/components/schemas/GatewayPoolId"

    GatewayPoolView:
      type: object
      additionalProperties: false
      required:
        - gateway_pool_id
        - edge_cluster_id
        - display_name
        - agent_endpoint
        - desired_replicas
        - minimum_ready_replicas
        - state
        - config_generation
        - resource_version
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        agent_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        s3_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        desired_replicas:
          $ref: "#/components/schemas/GatewayReplicaCount"
        minimum_ready_replicas:
          $ref: "#/components/schemas/GatewayReplicaCount"
        state:
          $ref: "#/components/schemas/GatewayPoolState"
        config_generation:
          $ref: "#/components/schemas/PositiveCanonicalU64"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    CreateGatewayReplicaRequest:
      type: object
      additionalProperties: false
      required:
        - gateway_replica_id
        - gateway_pool_id
        - control_endpoint
        - peer_endpoint
        - bootstrap_endpoint
        - software_version
        - wire_version
      properties:
        gateway_replica_id:
          $ref: "#/components/schemas/GatewayReplicaId"
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        control_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        peer_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        bootstrap_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        software_version:
          type: string
          minLength: 1
          maxLength: 256
        wire_version:
          type: integer
          const: 1
        capabilities:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128

    QueryGatewayReplicaListRequest:
      type: object
      additionalProperties: false
      required: [gateway_pool_id]
      properties:
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        state:
          $ref: "#/components/schemas/GatewayReplicaState"
        after:
          $ref: "#/components/schemas/GatewayReplicaId"
        page_size:
          type: integer
          minimum: 1
          maximum: 255

    MutateGatewayReplicaRequest:
      type: object
      additionalProperties: false
      required: [gateway_replica_id, expected_resource_version]
      properties:
        gateway_replica_id:
          $ref: "#/components/schemas/GatewayReplicaId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"

    ActivateGatewayReplicaRequest:
      type: object
      additionalProperties: false
      required:
        [gateway_replica_id, expected_resource_version, activation_token]
      properties:
        gateway_replica_id:
          $ref: "#/components/schemas/GatewayReplicaId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        activation_token:
          type: string
          writeOnly: true
          minLength: 51
          maxLength: 51
          pattern: "^nggw_v1_[A-Za-z0-9_-]{43}$"

    CreateGatewayReplicaResponse:
      type: object
      additionalProperties: false
      required: [gateway_replica, request_replayed, execution_reused]
      properties:
        gateway_replica:
          $ref: "#/components/schemas/GatewayReplicaView"
        activation_token:
          type: string
          readOnly: true
          minLength: 51
          maxLength: 51
          pattern: "^nggw_v1_[A-Za-z0-9_-]{43}$"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    GatewayReplicaResponse:
      type: object
      additionalProperties: false
      required: [gateway_replica, request_replayed, execution_reused]
      properties:
        gateway_replica:
          $ref: "#/components/schemas/GatewayReplicaView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    GatewayReplicaListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 255
          items:
            $ref: "#/components/schemas/GatewayReplicaView"
        next_after:
          $ref: "#/components/schemas/GatewayReplicaId"

    GatewayReplicaView:
      type: object
      additionalProperties: false
      required:
        - gateway_replica_id
        - gateway_pool_id
        - edge_cluster_id
        - control_endpoint
        - peer_endpoint
        - bootstrap_endpoint
        - software_version
        - wire_version
        - capabilities
        - state
        - credential_state
        - resource_version
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        gateway_replica_id:
          $ref: "#/components/schemas/GatewayReplicaId"
        gateway_pool_id:
          $ref: "#/components/schemas/GatewayPoolId"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        control_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        peer_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        bootstrap_endpoint:
          $ref: "#/components/schemas/GatewayEndpoint"
        software_version:
          type: string
          minLength: 1
          maxLength: 256
        wire_version:
          type: integer
          const: 1
        capabilities:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        last_heartbeat_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        state:
          $ref: "#/components/schemas/GatewayReplicaState"
        credential_state:
          $ref: "#/components/schemas/GatewayCredentialState"
        certificate_generation:
          $ref: "#/components/schemas/PositiveCanonicalU64"
        certificate_not_after_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    GatewayPoolState:
      type: string
      enum: [provisioning, ready, draining, disabled]

    GatewayReplicaState:
      type: string
      enum: [pending, active, draining, revoked]

    GatewayCredentialState:
      type: string
      enum:
        [
          pending_activation,
          pending_certificate_delivery,
          active,
          expired,
          revoked,
        ]

    GatewayReplicaCount:
      type: integer
      minimum: 1
      maximum: 65535

    GatewayEndpoint:
      type: string
      description: canonical HTTPS origin；开发环境允许 literal loopback HTTP origin；不得包含 userinfo、path、query、fragment 或尾随斜杠。
      format: uri
      minLength: 9
      maxLength: 2048
      pattern: '^(?:https://(?:\[[0-9A-Fa-f:.]+\]|[^@/?#\s:]+)(?::[0-9]{1,5})?|http://(?:localhost|127(?:\.[0-9]{1,3}){3}|\[::1\])(?::[0-9]{1,5})?)$'

    QueryTenantListRequest:
      type: object
      additionalProperties: false
      properties:
        cursor:
          $ref: "#/components/schemas/PageCursor"
        page_size:
          $ref: "#/components/schemas/PageSize"
        query:
          $ref: "#/components/schemas/SearchQuery"

    QueryTenantListResponse:
      type: object
      additionalProperties: false
      required: [items, can_create_tenant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TenantView"
        next_cursor:
          $ref: "#/components/schemas/PageCursor"
        can_create_tenant:
          type: boolean

    QueryTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"

    QueryTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantView"

    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, display_name]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        description:
          $ref: "#/components/schemas/Description"

    CreateTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant, request_replayed, execution_reused]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    TenantView:
      type: object
      description: 当前 principal 可见的脱敏租户视图，不包含认证策略或存储配置。
      additionalProperties: false
      required:
        - tenant_id
        - display_name
        - resource_version
        - created_at_unix_ms
        - updated_at_unix_ms
        - permissions
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        description:
          $ref: "#/components/schemas/Description"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        permissions:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionName"

    QueryStorageVolumeListRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        region:
          $ref: "#/components/schemas/RegionName"
        backend_type:
          $ref: "#/components/schemas/StorageBackendType"
        cursor:
          $ref: "#/components/schemas/PageCursor"
        page_size:
          $ref: "#/components/schemas/PageSize"
        query:
          $ref: "#/components/schemas/SearchQuery"

    QueryStorageVolumeListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StorageVolumeView"
        next_cursor:
          $ref: "#/components/schemas/PageCursor"

    QueryStorageVolumeRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, storage_volume_id]
      description: |
        查询 StorageVolume 的脱敏视图。通常需要 `storage.read`；Snapshot 只读用户也可以提供
        `snapshot_id`，但服务端只允许查询该 Snapshot 创建时绑定的唯一 StorageVolume，不得借此
        枚举其他磁盘。
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"

    QueryStorageVolumeResponse:
      type: object
      additionalProperties: false
      required: [storage_volume]
      properties:
        storage_volume:
          $ref: "#/components/schemas/StorageVolumeView"

    CreateStorageVolumeRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - storage_volume_id
        - display_name
        - edge_cluster_id
        - region
        - backend_type
        - access_mode
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        region:
          $ref: "#/components/schemas/RegionName"
        backend_type:
          $ref: "#/components/schemas/StorageBackendType"
        access_mode:
          $ref: "#/components/schemas/StorageAccessMode"
        allowed_delivery_modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SnapshotDeliveryMode"
        hardlink_policy:
          $ref: "#/components/schemas/HardlinkPolicy"
        max_whole_file_bytes:
          $ref: "#/components/schemas/DecimalU64"
        copy_reserve_bytes:
          $ref: "#/components/schemas/DecimalU64"
        pvc_reference:
          $ref: "#/components/schemas/PvcReference"
        nfs_reference:
          $ref: "#/components/schemas/NfsReference"
      oneOf:
        - properties:
            backend_type:
              const: pvc
            nfs_reference: false
          required: [pvc_reference]
        - properties:
            backend_type:
              const: nfs
            pvc_reference: false
          required: [nfs_reference]

    CreateStorageVolumeResponse:
      type: object
      additionalProperties: false
      required: [storage_volume, request_replayed, execution_reused]
      properties:
        storage_volume:
          $ref: "#/components/schemas/StorageVolumeView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    StorageVolumeView:
      type: object
      description: |
        租户登记的稳定逻辑存储身份。PVC namespace/claim 可以公开用于运维识别；NFS
        server、export path、凭据、中心挂载路径和 Agent ownership 不属于公开视图。只有 `state=ready`
        可用于创建新的 Workspace 或 Snapshot；`degraded` 与 `unavailable` 仍可查询，但禁止新放置。
      additionalProperties: false
      required:
        - tenant_id
        - storage_volume_id
        - display_name
        - edge_cluster_id
        - region
        - backend_type
        - access_mode
        - allowed_delivery_modes
        - hardlink_policy
        - max_whole_file_bytes
        - copy_reserve_bytes
        - state
        - resource_version
        - lifecycle
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        region:
          $ref: "#/components/schemas/RegionName"
        backend_type:
          $ref: "#/components/schemas/StorageBackendType"
        access_mode:
          $ref: "#/components/schemas/StorageAccessMode"
        allowed_delivery_modes:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotDeliveryMode"
        hardlink_policy:
          $ref: "#/components/schemas/HardlinkPolicy"
        max_whole_file_bytes:
          $ref: "#/components/schemas/DecimalU64"
        copy_reserve_bytes:
          $ref: "#/components/schemas/DecimalU64"
        pvc_reference:
          $ref: "#/components/schemas/PvcReference"
        state:
          $ref: "#/components/schemas/StorageVolumeState"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        lifecycle:
          $ref: "#/components/schemas/ResourceLifecycleView"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    CreateStorageEnrollmentTokenRequest:
      type: object
      description: |
        为待接入 PVC 冻结完整公开 Volume descriptor 并创建 bootstrap token。该请求不要求
        StorageVolume 已存在，也不接受现有 Volume resource version。
      additionalProperties: false
      required:
        - tenant_id
        - token_request_id
        - storage_volume_id
        - display_name
        - edge_cluster_id
        - region
        - access_mode
        - pvc_reference
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        token_request_id:
          $ref: "#/components/schemas/RequestId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        region:
          $ref: "#/components/schemas/RegionName"
        access_mode:
          $ref: "#/components/schemas/StorageEnrollmentAccessMode"
        pvc_reference:
          $ref: "#/components/schemas/PvcReference"

    CreateStorageEnrollmentTokenResponse:
      type: object
      description: |
        原始 bootstrap token 只在本响应中返回。相同 token_request_id 和完全相同 payload 重放时返回
        同一 token_id、bootstrap_token、volume_descriptor_digest 和 expires_at_unix_ms，并将
        request_replayed 设为 true；不同请求但相同语义执行则将 execution_reused 设为 true。
        Agent 配置必须使用该服务端冻结的 descriptor digest。
      additionalProperties: false
      required:
        [
          token_id,
          bootstrap_token,
          volume_descriptor_digest,
          expires_at_unix_ms,
          request_replayed,
          execution_reused,
        ]
      properties:
        token_id:
          $ref: "#/components/schemas/StorageEnrollmentTokenId"
        bootstrap_token:
          $ref: "#/components/schemas/StorageEnrollmentBootstrapToken"
        volume_descriptor_digest:
          $ref: "#/components/schemas/ContentDigest"
        expires_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    QueryStorageEnrollmentListRequest:
      type: object
      additionalProperties: false
