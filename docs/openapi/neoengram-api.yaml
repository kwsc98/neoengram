          type: boolean

    QuerySnapshotFileListRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, snapshot_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"
        path_prefix:
          $ref: "#/components/schemas/LogicalPath"
        format:
          $ref: "#/components/schemas/FileFormat"
        cursor:
          $ref: "#/components/schemas/PageCursor"
