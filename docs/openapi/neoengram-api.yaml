      required:
        - tenant_id
        - project_id
        - artifact_id
        - playground_id
        - storage_volume_id
        - region
        - display_name
        - index_version
        - state
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        playground_id:
          $ref: "#/components/schemas/PlaygroundId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        region:
          $ref: "#/components/schemas/RegionName"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        base_commit_id:
          $ref: "#/components/schemas/ContentDigest"
        head_commit_id:
          $ref: "#/components/schemas/ContentDigest"
        index_version:
          $ref: "#/components/schemas/IndexVersion"
        state:
          $ref: "#/components/schemas/PlaygroundState"
        active_precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    StartPreCommitRequest:
      type: object
      description: |
        创建新 Pre-commit 会话的请求。服务端内部冻结当前 Head；客户端不提交
        `source_head_commit_id`，也不能通过读取页面隐式发送本请求。
      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal, request_digest]
      required:
        - tenant_id
        - project_id
        - artifact_id
        - playground_id
        - precommit_request_id
        - expected_index_version
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        playground_id:
          $ref: "#/components/schemas/PlaygroundId"
        precommit_request_id:
          $ref: "#/components/schemas/ResourceId"
        expected_index_version:
          $ref: "#/components/schemas/IndexVersion"

    StartPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit, playground, replayed]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"
        playground:
          $ref: "#/components/schemas/PlaygroundView"
        replayed:
          type: boolean

    QueryPreCommitRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, precommit_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"

    QueryPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"

    RestartPreCommitRequest:
      type: object
      description: |
        仅为 abnormal/cancelled 会话创建下一 attempt，保持 `precommit_id`。running/ready 的重新检测
        使用 cancel 后 start，并获得新的会话 ID。
      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal, request_digest]
      required:
        [tenant_id, precommit_id, restart_request_id, expected_index_version]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        restart_request_id:
          $ref: "#/components/schemas/ResourceId"
        expected_index_version:
          $ref: "#/components/schemas/IndexVersion"

    RestartPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit, playground, replayed]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"
        playground:
          $ref: "#/components/schemas/PlaygroundView"
        replayed:
          type: boolean

    CancelPreCommitRequest:
      type: object
      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal, request_digest]
      required: [tenant_id, precommit_id, cancel_request_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        cancel_request_id:
          $ref: "#/components/schemas/ResourceId"

