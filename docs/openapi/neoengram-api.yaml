      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"

    QueryPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"

    RestartPreCommitRequest:
      type: object
      description: |
        仅为 abnormal/cancelled 会话创建下一 attempt，保持 `precommit_id`。running/ready 的重新检测
        使用 cancel 后 start，并获得新的会话 ID。
      additionalProperties: false
      required:
        [tenant_id, precommit_id, restart_request_id, expected_index_version]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        restart_request_id:
          $ref: "#/components/schemas/ResourceId"
        expected_index_version:
          $ref: "#/components/schemas/IndexVersion"

    RestartPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit, workspace, request_replayed, execution_reused]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    CancelPreCommitRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, precommit_id, cancel_request_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        cancel_request_id:
          $ref: "#/components/schemas/ResourceId"

    CancelPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit, workspace, request_replayed, execution_reused]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    PreCommitState:
      type: string
      description: |
        会话结果状态。可提交结果为 `ready`；阻断或执行失败为 `abnormal`。所有非 running 状态的
        phase 均为 `idle`。
      enum: [running, ready, abnormal, cancelled, committed]

    PreCommitPhase:
      type: string
      description: |
        running 会话的执行阶段；`idle` 用于 ready、abnormal、cancelled 和 committed 终态。
        `ready` 不是 phase。
      enum: [queued, scanning, hashing, uploading, validating, idle]

    PreCommitView:
      type: object
      description: |
        Workspace 某一 IndexVersion 的冻结候选及其脱敏检查结果。`ready/idle` 必须有候选且 blockers
        为空；`abnormal/idle` 且 blockers 非空在产品中显示为 Blocked。服务端冻结的 Head 不公开。
      additionalProperties: false
      required:
        - tenant_id
        - project_id
        - artifact_id
        - workspace_id
        - precommit_id
        - precommit_request_id
        - attempt
        - state
        - phase
        - progress
        - checks
        - warnings
        - blockers
        - source_index_version
        - data_layout
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        workspace_id:
          $ref: "#/components/schemas/WorkspaceId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        precommit_request_id:
          $ref: "#/components/schemas/ResourceId"
        attempt:
          type: integer
          minimum: 1
          maximum: 2147483647
        state:
          $ref: "#/components/schemas/PreCommitState"
        phase:
          $ref: "#/components/schemas/PreCommitPhase"
        progress:
          $ref: "#/components/schemas/PreCommitProgress"
        checks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreCommitCheck"
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreCommitNotice"
        blockers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreCommitNotice"
        source_index_version:
          $ref: "#/components/schemas/IndexVersion"
        data_layout:
          $ref: "#/components/schemas/DataLayout"
        candidate_index_version:
          $ref: "#/components/schemas/IndexVersion"
        diff_summary:
          $ref: "#/components/schemas/CommitDiffSummary"
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        committed_commit_id:
          $ref: "#/components/schemas/CommitId"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

