          type: boolean

    ArtifactView:
      type: object
      description: |
        Artifact 是不绑定 Region 或 StorageVolume 的版本化逻辑数据资产。初始化血缘只暴露
        同 Tenant 的逻辑来源，不暴露 ArtifactPlacement、Manifest 或物理对象位置。
      additionalProperties: false
