      description: |
        要求 `storage.enrollment.review` 权限。仅允许拒绝未过期的 `pending_approval` enrollment；服务端使用
        `expected_resource_version` 执行 CAS 并记录认证 actor 的审计事件。拒绝是终态，不签发 Agent
