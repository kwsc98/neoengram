openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: NeoEngram Public API
  version: 1.0.0
  summary: NeoEngram 用户、CLI 和 UI 使用的非 REST JSON API 契约
  description: |
    这是 NeoEngram 中心服务的首版公开 API 设计契约。当前仓库尚未实现 HTTP
    server、路由或认证 adapter，因此本文档不表示这些地址已经可以访问。

    业务方法使用“模块 / 子域 / 动作”路径，并通过普通 JSON 请求和响应调用；
    路径不包含版本号。除版本查询和健康检查外，调用方必须发送
    `NeoEngram-API-Version: 1` 和 Bearer JWT。

    Agent 的双向 `application/json-seq` session 不属于本 OpenAPI。其消息、分页和
    重放契约由 `neoengram-protocol` JSON Schema 与中心 Agent 架构文档定义。
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0

servers:
  - url: /
    description: 与当前 neoengramd origin 相同

tags:
  - name: System
    description: API 版本和兼容能力查询
  - name: Tenant
    description: 当前 principal 可见的租户与平台级租户创建方法
  - name: Storage
    description: 租户登记的 StorageVolume 查询与创建方法
  - name: Project
    description: 租户内只读 Project 查询方法
  - name: Artifact
    description: 租户内 Artifact 创建、查询，以及 Commit 图和文件 Diff 查询方法
  - name: Playground
    description: 租户内 Playground 创建、查询和 Commit 方法
  - name: Snapshot
    description: 绑定 Artifact Commit 的只读 Snapshot 创建与查询方法
  - name: Job
    description: 用户发起和查询的中心权威 Job 方法
  - name: Health
    description: 供进程管理器和负载均衡器调用的标准健康探针

paths:
  /api/system/version/query:
    post:
      tags: [System]
      operationId: queryApiVersion
      summary: 查询 API 和 Agent 协议版本
      security: []
      description: |
        返回当前服务理解的公开 API 版本和 Agent wire protocol 版本。该方法用于
        版本协商，因此不要求 `NeoEngram-API-Version` 或认证。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
            example: {}
      responses:
        '200':
          description: 版本与能力信息
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionResponse'
              example:
                api_versions: [1]
                agent_protocol_versions: [1]
                capabilities:
                  - managed_add
                  - sqlite_authority
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/tenant/list/query:
    post:
      tags: [Tenant]
      operationId: queryTenantList
      summary: 查询当前用户可见租户
      description: |
        分页返回认证 principal 已获授权的租户。列表不会返回 principal 无权访问的租户，
        `can_create_tenant` 只用于界面能力提示，服务端仍必须在创建时重新授权。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTenantListRequest'
            example:
              page_size: 50
              query: research
      responses:
        '200':
          description: 当前 principal 可见的租户页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryTenantListResponse'
              example:
                items:
                  - tenant_id: tenant-a
                    display_name: 研究数据平台
                    description: 研究团队的受管数据空间
                    resource_version: '3'
                    created_at_unix_ms: '1785167000000'
                    updated_at_unix_ms: '1785167600000'
                    permissions: [tenant.read, artifact.read, job.create]
                next_cursor: tenant-page-2
                can_create_tenant: true
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/tenant/query:
    post:
      tags: [Tenant]
      operationId: queryTenant
      summary: 查询单个租户
      description: 查询当前 principal 可见的租户视图；不可见与不存在统一返回 404。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTenantRequest'
            example:
              tenant_id: tenant-a
      responses:
        '200':
          description: 可见租户的当前视图
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryTenantResponse'
              example:
                tenant:
                  tenant_id: tenant-a
                  display_name: 研究数据平台
                  description: 研究团队的受管数据空间
                  resource_version: '3'
                  created_at_unix_ms: '1785167000000'
                  updated_at_unix_ms: '1785167600000'
                  permissions: [tenant.read, artifact.read, job.create]
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/tenant/create:
    post:
      tags: [Tenant]
      operationId: createTenant
      summary: 创建租户
      description: |
        仅平台管理员可调用。相同 tenant ID 和相同 canonical 创建内容返回既有租户并标记重放；
        相同 tenant ID 对应不同内容时返回 `TENANT_ID_REUSED`。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              tenant_id: tenant-lab
              display_name: 算法实验室
              description: 算法团队的受管数据空间
      responses:
        '200':
          description: 租户已创建或相同创建请求被重放
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
              examples:
                created:
                  value:
                    tenant:
                      tenant_id: tenant-lab
                      display_name: 算法实验室
                      description: 算法团队的受管数据空间
                      resource_version: '1'
                      created_at_unix_ms: '1785168000000'
                      updated_at_unix_ms: '1785168000000'
                      permissions: [tenant.admin, tenant.read, artifact.read, job.create]
                    replayed: false
                replayed:
                  value:
                    tenant:
                      tenant_id: tenant-lab
                      display_name: 算法实验室
                      description: 算法团队的受管数据空间
                      resource_version: '1'
                      created_at_unix_ms: '1785168000000'
                      updated_at_unix_ms: '1785168000000'
                      permissions: [tenant.admin, tenant.read, artifact.read, job.create]
                    replayed: true
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '409':
          $ref: '#/components/responses/TenantConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/storage/volume/list/query:
    post:
      tags: [Storage]
      operationId: queryStorageVolumeList
      summary: 查询租户内 StorageVolume
      description: |
        分页返回租户登记的逻辑存储卷。返回值不包含挂载路径、凭据、Agent ownership
        或 fencing 信息；region 和 EdgeCluster 用于创建资源时选择放置位置。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryStorageVolumeListRequest'
            example:
              tenant_id: tenant-a
              page_size: 50
      responses:
        '200':
          description: StorageVolume 页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStorageVolumeListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '409':
          $ref: '#/components/responses/CursorConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/storage/volume/query:
    post:
      tags: [Storage]
      operationId: queryStorageVolume
      summary: 查询单个 StorageVolume
      description: 按 tenant 和稳定逻辑存储 ID 返回可用于资源放置选择的公开视图。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryStorageVolumeRequest'
      responses:
        '200':
          description: StorageVolume 当前公开视图
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryStorageVolumeResponse'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/storage/volume/create:
    post:
      tags: [Storage]
      operationId: createStorageVolume
      summary: 登记 StorageVolume
      description: |
        在租户内登记已有 PVC 或 NFS 后端，不创建 Kubernetes PV/PVC 或 NFS 资源。
        region 由 StorageVolume 固定，后续资源创建只提交 storage_volume_id。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorageVolumeRequest'
            example:
              tenant_id: tenant-a
              storage_volume_id: volume-vision
              display_name: 视觉数据 PVC
              edge_cluster_id: cluster-cn-east-1
              region: cn-shanghai
              backend_type: pvc
              access_mode: read_write_many
              pvc_reference:
                namespace: neoengram-data
                claim_name: vision-data
      responses:
        '200':
          description: StorageVolume 已登记或相同请求被重放
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStorageVolumeResponse'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '409':
          $ref: '#/components/responses/MutationConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/project/list/query:
    post:
      tags: [Project]
      operationId: queryProjectList
      summary: 查询租户内 Project
      description: 分页返回租户内当前 principal 可见的 Project，用于资源筛选。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryProjectListRequest'
            example:
              tenant_id: tenant-a
              page_size: 50
      responses:
        '200':
          description: Project 页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryProjectListResponse'
              example:
                items:
                  - tenant_id: tenant-a
                    project_id: project-vision
                    display_name: 视觉数据
                    created_at_unix_ms: '1785167000000'
                    updated_at_unix_ms: '1785167600000'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/artifact/list/query:
    post:
      tags: [Artifact]
      operationId: queryArtifactList
      summary: 查询租户内 Artifact
      description: 按可选 Project 和关键字过滤，分页返回脱敏 Artifact 视图。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryArtifactListRequest'
            example:
              tenant_id: tenant-a
              project_id: project-vision
              page_size: 50
      responses:
        '200':
          description: Artifact 页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryArtifactListResponse'
              example:
                items:
                  - tenant_id: tenant-a
                    project_id: project-vision
                    artifact_id: road-scenes
                    storage_volume_id: volume-shanghai-vision
                    region: cn-shanghai
                    display_name: 道路场景数据集
                    description: 训练与回归评估数据
                    default_ref: refs/heads/main
                    resource_version: '18'
                    created_at_unix_ms: '1785167000000'
                    updated_at_unix_ms: '1785167600000'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/artifact/query:
    post:
      tags: [Artifact]
      operationId: queryArtifact
      summary: 查询 Artifact 详情
      description: 按完整 tenant、project、artifact scope 查询公开 Artifact 元数据。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryArtifactRequest'
            example:
              tenant_id: tenant-a
              project_id: project-vision
              artifact_id: road-scenes
      responses:
        '200':
          description: Artifact 当前视图
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryArtifactResponse'
              example:
                artifact:
                  tenant_id: tenant-a
                  project_id: project-vision
                  artifact_id: road-scenes
                  storage_volume_id: volume-shanghai-vision
                  region: cn-shanghai
                  display_name: 道路场景数据集
                  description: 训练与回归评估数据
                  default_ref: refs/heads/main
                  resource_version: '18'
                  created_at_unix_ms: '1785167000000'
                  updated_at_unix_ms: '1785167600000'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/artifact/create:
    post:
      tags: [Artifact]
      operationId: createArtifact
      summary: 创建 Artifact
      description: 在指定 Tenant/Project 下创建空 Artifact；资源身份使相同请求可幂等重放。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArtifactRequest'
            example:
              tenant_id: tenant-a
              project_id: project-vision
              artifact_id: evaluation-set
              storage_volume_id: volume-shanghai-vision
              display_name: 评测数据集
              default_ref: refs/heads/main
      responses:
        '200':
          description: 已创建或幂等返回的 Artifact
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateArtifactResponse'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '409':
          $ref: '#/components/responses/MutationConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/artifact/commit/graph/query:
    post:
      tags: [Artifact]
      operationId: queryArtifactCommitGraph
      summary: 查询 Artifact Commit 图
      description: |
        分页返回单 parent Commit 节点和 Ref tips。Cursor 绑定 graph version 与完整 scope；
        公开节点不包含 root directory、Manifest、Chunk 或存储信息。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryArtifactCommitGraphRequest'
            example:
              tenant_id: tenant-a
              project_id: project-vision
              artifact_id: road-scenes
              page_size: 50
      responses:
        '200':
          description: Commit 图的一页
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryArtifactCommitGraphResponse'
              example:
                graph:
                  graph_version: '18'
                  refs:
                    - name: refs/heads/main
                      commit_id: commit-main-3
                    - name: refs/heads/experiment
                      commit_id: commit-exp-2
                  nodes:
                    - commit_id: commit-main-3
                      parent_commit_id: commit-main-2
                      message: 补充夜间道路场景
                      ref_names: [refs/heads/main]
                      created_at_unix_ms: '1785167600000'
                    - commit_id: commit-exp-2
                      parent_commit_id: commit-main-2
                      message: 实验标注集
                      ref_names: [refs/heads/experiment]
                      created_at_unix_ms: '1785167500000'
        '401':
          $ref: '#/components/responses/AuthenticationProblem'
        '403':
          $ref: '#/components/responses/AuthorizationProblem'
        '404':
          $ref: '#/components/responses/ResourceNotFoundProblem'
        '409':
          $ref: '#/components/responses/CursorConflictProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLargeProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/ServiceUnavailableProblem'

  /api/artifact/commit/diff/query:
    post:
      tags: [Artifact]
      operationId: queryArtifactCommitDiff
      summary: 查询 Commit 文件差异
