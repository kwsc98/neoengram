          $ref: "#/components/schemas/ResourceRef"
        message:
          type: string
          minLength: 1
          maxLength: 4096

    DeletionImpactView:
      type: object
      description: 五分钟内不可变且与资源版本、依赖集合和删除确认选项绑定的 dry-run 结果。
      additionalProperties: false
