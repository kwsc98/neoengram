components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        由部署配置的 OIDC issuer 签发。服务端从 token 映射 PrincipalRef 和 tenant scope；
        请求体中的任何身份提示都不能覆盖认证结果。

  parameters:
    ApiVersion:
      name: NeoEngram-API-Version
      in: header
      required: true
      description: 公开 API 主版本；不兼容演进不改变 path。
      schema:
        type: string
        enum: ['1']
      example: '1'
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        可选的调用方请求 ID。缺失时由服务端生成；无论来源如何，响应都必须回传最终 ID。
      schema:
        $ref: '#/components/schemas/RequestId'
      example: req-20260727-001
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context traceparent。
      schema:
        type: string
        minLength: 55
        maxLength: 512
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01

  headers:
    RequestId:
      required: true
      description: 服务端确认或生成的请求 ID。
      schema:
        $ref: '#/components/schemas/RequestId'
      example: req-20260727-001

  responses:
    AuthenticationProblem:
      description: Bearer token 缺失、无效或已过期
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:authentication-required
            title: Authentication required
            status: 401
            detail: A valid Bearer token is required
            instance: /api/job/query
            code: AUTHENTICATION_REQUIRED
            request_id: req-20260727-001
            retryable: false
    AuthorizationProblem:
      description: principal 无权执行当前方法
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:authorization-denied
            title: Authorization denied
            status: 403
            detail: The principal is not authorized for this operation
            instance: /api/job/add/finalize
            code: AUTHORIZATION_DENIED
            request_id: req-20260727-001
            retryable: false
    JobNotFoundProblem:
      description: Job 不存在或对当前 principal 不可见
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:job-not-found
            title: Job not found
            status: 404
            detail: The requested Job was not found
            instance: /api/job/query
            code: JOB_NOT_FOUND
            request_id: req-20260727-001
            retryable: false
    ResourceNotFoundProblem:
      description: 资源不存在，或对当前 principal 不可见
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            tenantNotFound:
              value:
                type: urn:neoengram:problem:tenant-not-found
                title: Tenant not found
                status: 404
                detail: The requested Tenant was not found
                instance: /api/tenant/query
                code: TENANT_NOT_FOUND
                request_id: req-20260727-001
                retryable: false
            artifactNotFound:
              value:
                type: urn:neoengram:problem:artifact-not-found
                title: Artifact not found
                status: 404
                detail: The requested Artifact was not found
                instance: /api/artifact/query
                code: ARTIFACT_NOT_FOUND
                request_id: req-20260727-001
                retryable: false
    TenantConflictProblem:
      description: Tenant ID 已绑定另一份创建内容
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:tenant-id-reused
            title: Tenant ID reused
            status: 409
            detail: The Tenant ID already belongs to a different create request
            instance: /api/tenant/create
            code: TENANT_ID_REUSED
            request_id: req-20260727-001
            retryable: false
    MutationConflictProblem:
      description: 资源 identity 已绑定另一创建内容，或 expected version 不再匹配
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:resource-conflict
            title: Resource mutation conflict
            status: 409
            detail: The resource identity or expected version conflicts with current state
            instance: /api/playground/commit/create
            code: RESOURCE_CONFLICT
            request_id: req-20260727-001
            retryable: false
    CursorConflictProblem:
      description: Cursor 无效、已过期或与当前 scope/filter 不匹配
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:cursor-invalid
            title: Cursor is invalid
            status: 409
            detail: The cursor is invalid or does not match the current query
            instance: /api/artifact/commit/graph/query
            code: CURSOR_INVALID
            request_id: req-20260727-001
            retryable: false
    DeadlineProblem:
      description: Job deadline 或有效 assignment lease 已过期
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:job-deadline-exceeded
            title: Job deadline exceeded
            status: 408
            detail: The managed Add deadline has elapsed
            instance: /api/job/add/finalize
            code: JOB_DEADLINE_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    CreateConflictProblem:
      description: Job ID 已绑定另一请求，或 Job 创建发生并发冲突
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            reusedJobId:
              summary: 相同 Job ID 携带另一 request digest
              value:
                type: urn:neoengram:problem:job-id-reused
                title: Job ID reused
                status: 409
                detail: The Job ID already belongs to a different managed Add request
                instance: /api/job/add/create
                code: JOB_ID_REUSED
                request_id: req-20260727-001
                retryable: false
            concurrentUpdate:
              summary: authority CAS 发生并发更新
              value:
                type: urn:neoengram:problem:concurrent-update
                title: Concurrent update
                status: 409
                detail: The Job resource version changed during the request
                instance: /api/job/add/create
                code: CONCURRENT_UPDATE
                request_id: req-20260727-001
                retryable: true
                retry_after_ms: '100'
    FinalizeConflictProblem:
      description: Job 状态、MetadataBatch、durability 或 CAS 前置条件尚不满足
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidState:
              summary: Job 尚未进入 Prepared
              value:
                type: urn:neoengram:problem:job-invalid-state
                title: Job state does not allow finalization
                status: 409
                detail: Managed Add can only be finalized from Prepared or a stable terminal state
                instance: /api/job/add/finalize
                code: JOB_INVALID_STATE
                request_id: req-20260727-001
                retryable: false
            objectNotDurable:
              summary: 引用对象尚未被中心确认为 Durable
              value:
                type: urn:neoengram:problem:object-not-durable
                title: Object is not durable
                status: 409
                detail: A referenced object has no durable central receipt
                instance: /api/job/add/finalize
                code: OBJECT_NOT_DURABLE
                request_id: req-20260727-001
                retryable: true
                retry_after_ms: '1000'
    PayloadTooLargeProblem:
      description: 请求编码字节数超过当前方法上限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:payload-too-large
            title: Payload too large
            status: 413
            detail: The encoded request exceeds the method limit
            instance: /api/job/add/create
            code: PROTOCOL_LIMIT_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    ValidationProblem:
      description: 请求 header、protocol 或 metadata 违反公开契约
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unsupportedApiVersion:
              summary: API 主版本不受支持
              value:
                type: urn:neoengram:problem:api-version-unsupported
                title: API version is unsupported
                status: 422
                detail: NeoEngram-API-Version must be 1
                instance: /api/job/query
                code: API_VERSION_UNSUPPORTED
                request_id: req-20260727-001
                retryable: false
                violations:
                  - field: NeoEngram-API-Version
                    reason: unsupported value
            invalidPathSelection:
              summary: Add path 集合无效
              value:
                type: urn:neoengram:problem:protocol-invalid
                title: Request validation failed
                status: 422
                detail: paths must be non-empty unless all is true
                instance: /api/job/add/create
                code: PROTOCOL_INVALID
                request_id: req-20260727-001
                retryable: false
                violations:
                  - field: paths
                    reason: must be non-empty unless all is true
    InternalProblem:
      description: 未分类的服务端内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:internal
            title: Internal error
            status: 500
            detail: The server could not complete the request
            instance: /api/job/query
            code: INTERNAL
            request_id: req-20260727-001
            retryable: true
    ServiceUnavailableProblem:
      description: authority 或必要依赖暂不可用
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: urn:neoengram:problem:storage-failure
            title: Authority unavailable
            status: 503
            detail: The authority store is temporarily unavailable
            instance: /health/ready
            code: STORAGE_FAILURE
            request_id: req-20260727-001
            retryable: true
            retry_after_ms: '1000'

  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false

    ApiVersionResponse:
      type: object
      additionalProperties: false
      required:
        - api_versions
        - agent_protocol_versions
        - capabilities
      properties:
        api_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [1]
        agent_protocol_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [1]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-z][a-z0-9_]{0,127}$'

    QueryTenantListRequest:
      type: object
      additionalProperties: false
      properties:
        cursor:
          $ref: '#/components/schemas/PageCursor'
        page_size:
          $ref: '#/components/schemas/PageSize'
        query:
          $ref: '#/components/schemas/SearchQuery'

    QueryTenantListResponse:
      type: object
      additionalProperties: false
      required: [items, can_create_tenant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TenantView'
        next_cursor:
          $ref: '#/components/schemas/PageCursor'
        can_create_tenant:
          type: boolean

    QueryTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'

    QueryTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantView'

    CreateTenantRequest:
      type: object
      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal]
      required: [tenant_id, display_name]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        description:
          $ref: '#/components/schemas/Description'

    CreateTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant, replayed]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantView'
        replayed:
          type: boolean

    TenantView:
      type: object
      description: 当前 principal 可见的脱敏租户视图，不包含认证策略或存储配置。
      additionalProperties: false
      required:
        - tenant_id
        - display_name
        - resource_version
        - created_at_unix_ms
        - updated_at_unix_ms
        - permissions
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        description:
          $ref: '#/components/schemas/Description'
        resource_version:
          $ref: '#/components/schemas/CanonicalU64'
        created_at_unix_ms:
          $ref: '#/components/schemas/UnixMillis'
        updated_at_unix_ms:
          $ref: '#/components/schemas/UnixMillis'
        permissions:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionName'

    QueryStorageVolumeListRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        region:
          $ref: '#/components/schemas/RegionName'
        backend_type:
          $ref: '#/components/schemas/StorageBackendType'
        cursor:
          $ref: '#/components/schemas/PageCursor'
        page_size:
          $ref: '#/components/schemas/PageSize'
        query:
          $ref: '#/components/schemas/SearchQuery'

    QueryStorageVolumeListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StorageVolumeView'
        next_cursor:
          $ref: '#/components/schemas/PageCursor'

    QueryStorageVolumeRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, storage_volume_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        storage_volume_id:
          $ref: '#/components/schemas/StorageVolumeId'

    QueryStorageVolumeResponse:
      type: object
      additionalProperties: false
      required: [storage_volume]
      properties:
        storage_volume:
          $ref: '#/components/schemas/StorageVolumeView'

    CreateStorageVolumeRequest:
      type: object
      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal, credentials, mount_path]
      required:
        - tenant_id
        - storage_volume_id
        - display_name
        - edge_cluster_id
        - region
        - backend_type
        - access_mode
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        storage_volume_id:
          $ref: '#/components/schemas/StorageVolumeId'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        edge_cluster_id:
          $ref: '#/components/schemas/EdgeClusterId'
        region:
          $ref: '#/components/schemas/RegionName'
        backend_type:
          $ref: '#/components/schemas/StorageBackendType'
        access_mode:
          $ref: '#/components/schemas/StorageAccessMode'
        pvc_reference:
          $ref: '#/components/schemas/PvcReference'
        nfs_reference:
          $ref: '#/components/schemas/NfsReference'
      oneOf:
        - properties:
            backend_type:
              const: pvc
          required: [pvc_reference]
        - properties:
            backend_type:
              const: nfs
          required: [nfs_reference]

    CreateStorageVolumeResponse:
      type: object
      additionalProperties: false
      required: [storage_volume, replayed]
      properties:
        storage_volume:
          $ref: '#/components/schemas/StorageVolumeView'
        replayed:
          type: boolean

    StorageVolumeView:
      type: object
      description: |
        租户登记的稳定逻辑存储身份。PVC namespace/claim 可以公开用于运维识别；NFS
        server、export path、凭据、中心挂载路径和 Agent ownership 不属于公开视图。
      additionalProperties: false
      required:
        - tenant_id
        - storage_volume_id
        - display_name
        - edge_cluster_id
        - region
        - backend_type
        - access_mode
        - state
        - resource_version
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        storage_volume_id:
          $ref: '#/components/schemas/StorageVolumeId'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        edge_cluster_id:
          $ref: '#/components/schemas/EdgeClusterId'
        region:
          $ref: '#/components/schemas/RegionName'
        backend_type:
          $ref: '#/components/schemas/StorageBackendType'
        access_mode:
          $ref: '#/components/schemas/StorageAccessMode'
        pvc_reference:
          $ref: '#/components/schemas/PvcReference'
        state:
          $ref: '#/components/schemas/StorageVolumeState'
        resource_version:
          $ref: '#/components/schemas/CanonicalU64'
        created_at_unix_ms:
          $ref: '#/components/schemas/UnixMillis'
        updated_at_unix_ms:
          $ref: '#/components/schemas/UnixMillis'

    PvcReference:
      type: object
      additionalProperties: false
      required: [namespace, claim_name]
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
        claim_name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'

    NfsReference:
      type: object
      description: 仅在登记请求中使用；服务端不得在公开 StorageVolumeView 中回显。
      additionalProperties: false
      required: [server, export_path]
      properties:
        server:
          type: string
          minLength: 1
          maxLength: 253
        export_path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^/.*$'

    QueryProjectListRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        cursor:
          $ref: '#/components/schemas/PageCursor'
        page_size:
          $ref: '#/components/schemas/PageSize'
        query:
          $ref: '#/components/schemas/SearchQuery'

    QueryProjectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProjectSummary'
        next_cursor:
          $ref: '#/components/schemas/PageCursor'

    ProjectSummary:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - project_id
        - display_name
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        project_id:
          $ref: '#/components/schemas/ProjectId'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        created_at_unix_ms:
          $ref: '#/components/schemas/UnixMillis'
        updated_at_unix_ms:
          $ref: '#/components/schemas/UnixMillis'

    QueryArtifactListRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        project_id:
          $ref: '#/components/schemas/ProjectId'
        cursor:
          $ref: '#/components/schemas/PageCursor'
        page_size:
