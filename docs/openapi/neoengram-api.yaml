      additionalProperties: false
      required: [precommit, playground, replayed]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"
        playground:
          $ref: "#/components/schemas/PlaygroundView"
        replayed:
          type: boolean

    PreCommitState:
      type: string
      description: |
        会话结果状态。可提交结果为 `ready`；阻断或执行失败为 `abnormal`。所有非 running 状态的
        phase 均为 `idle`。
      enum: [running, ready, abnormal, cancelled, committed]

    PreCommitPhase:
      type: string
      description: |
        running 会话的执行阶段；`idle` 用于 ready、abnormal、cancelled 和 committed 终态。
        `ready` 不是 phase。
      enum: [queued, scanning, hashing, uploading, validating, idle]

    PreCommitView:
      type: object
      description: |
        Playground 某一 IndexVersion 的冻结候选及其脱敏检查结果。`ready/idle` 必须有候选且 blockers
        为空；`abnormal/idle` 且 blockers 非空在产品中显示为 Blocked。服务端冻结的 Head 不公开。
      additionalProperties: false
      required:
        - tenant_id
        - project_id
        - artifact_id
        - playground_id
        - precommit_id
        - precommit_request_id
        - attempt
        - state
        - phase
        - progress
        - checks
        - warnings
        - blockers
        - source_index_version
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        playground_id:
          $ref: "#/components/schemas/PlaygroundId"
        precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        precommit_request_id:
          $ref: "#/components/schemas/ResourceId"
        attempt:
          type: integer
          minimum: 1
          maximum: 2147483647
        state:
          $ref: "#/components/schemas/PreCommitState"
        phase:
          $ref: "#/components/schemas/PreCommitPhase"
        progress:
          $ref: "#/components/schemas/PreCommitProgress"
        checks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreCommitCheck"
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreCommitNotice"
        blockers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PreCommitNotice"
        source_index_version:
          $ref: "#/components/schemas/IndexVersion"
        candidate_index_version:
          $ref: "#/components/schemas/IndexVersion"
        diff_summary:
          $ref: "#/components/schemas/CommitDiffSummary"
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        committed_commit_id:
          $ref: "#/components/schemas/CommitId"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    PreCommitProgress:
      type: object
