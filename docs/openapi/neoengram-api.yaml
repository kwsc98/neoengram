      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        state:
          $ref: "#/components/schemas/StorageEnrollmentState"
        registration_kind:
          $ref: "#/components/schemas/StorageEnrollmentRegistrationKind"
        cursor:
          $ref: "#/components/schemas/PageCursor"
        page_size:
          $ref: "#/components/schemas/PageSize"
        query:
          $ref: "#/components/schemas/SearchQuery"

    QueryStorageEnrollmentListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StorageEnrollmentView"
        next_cursor:
          $ref: "#/components/schemas/PageCursor"

    QueryStorageEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, storage_enrollment_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_enrollment_id:
          $ref: "#/components/schemas/StorageEnrollmentId"

    QueryStorageEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollment]
      properties:
        enrollment:
          $ref: "#/components/schemas/StorageEnrollmentView"

    ApproveStorageEnrollmentRequest:
      type: object
      description: |
        使用 expected_resource_version 对 pending_approval enrollment 执行 CAS。replacement 必须显式
        confirm_replacement=true；approval_request_id 与完整 payload 构成稳定幂等 identity，并与
        rejection_request_id 共享 Tenant 级 decision request identity 命名空间。
      additionalProperties: false
      required:
        - tenant_id
        - storage_enrollment_id
        - approval_request_id
        - expected_resource_version
        - confirm_replacement
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_enrollment_id:
          $ref: "#/components/schemas/StorageEnrollmentId"
        approval_request_id:
          $ref: "#/components/schemas/RequestId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        confirm_replacement:
          type: boolean

    ApproveStorageEnrollmentResponse:
      type: object
      description: |
        审批事务返回更新后的 Enrollment 和创建或精确绑定的 StorageVolumeView。返回时 Enrollment 为
        approved，StorageVolume 固定为 unavailable；后续认证 Agent session 和健康 probe 才能分别
        推进到 enrolled 与 ready。
      additionalProperties: false
      required: [enrollment, storage_volume, request_replayed, execution_reused]
      properties:
        enrollment:
          $ref: "#/components/schemas/StorageEnrollmentView"
        storage_volume:
          $ref: "#/components/schemas/StorageVolumeView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    CompleteStorageRecoveryRequest:
      type: object
      description: |
        使用 expected_resource_version 和当前 owner_generation 完成 replacement recovery fence。
        Tenant、Enrollment 与 Owner generation 必须全部匹配服务端当前状态。
      additionalProperties: false
      required:
        - tenant_id
        - storage_enrollment_id
        - expected_resource_version
        - owner_generation
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_enrollment_id:
          $ref: "#/components/schemas/StorageEnrollmentId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        owner_generation:
          $ref: "#/components/schemas/CanonicalU64"

    CompleteStorageRecoveryResponse:
      type: object
      additionalProperties: false
      required: [enrollment, storage_volume]
      properties:
        enrollment:
          $ref: "#/components/schemas/StorageEnrollmentView"
        storage_volume:
          $ref: "#/components/schemas/StorageVolumeView"
        task:
          $ref: "#/components/schemas/TaskView"

    RejectStorageEnrollmentRequest:
      type: object
      description: |
        使用 expected_resource_version 对 pending_approval enrollment 执行 CAS；rejection_request_id
        与完整 payload 构成稳定幂等 identity，并与 approval_request_id 共享 Tenant 级 decision request
        identity 命名空间。
      additionalProperties: false
      required:
        - tenant_id
        - storage_enrollment_id
        - rejection_request_id
        - expected_resource_version
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_enrollment_id:
          $ref: "#/components/schemas/StorageEnrollmentId"
        rejection_request_id:
          $ref: "#/components/schemas/RequestId"
        expected_resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        reason:
          type: string
          minLength: 1
          maxLength: 2048

    RejectStorageEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [enrollment, request_replayed, execution_reused]
      properties:
        enrollment:
          $ref: "#/components/schemas/StorageEnrollmentView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    StorageEnrollmentView:
      type: object
      description: |
        Agent 使用单次 bootstrap token 提交的脱敏 PVC enrollment。pending_approval 自 created_at 起
        24 小时未审核即进入 expired；终态仍保留 expires_at_unix_ms 作为原审批期限。approved 仅表示
        管理员已审核并建立 unavailable Volume；认证 Agent session 和健康 probe 建立后才进入 enrolled。
        本视图不包含 token、token key ID、SPKI、签名、CSR、证书、PVC UID、挂载详情、拒绝原因或
        内部 Agent/session identity。
      additionalProperties: false
      required:
        - tenant_id
        - storage_enrollment_id
        - storage_volume_id
        - display_name
        - edge_cluster_id
        - region
        - access_mode
        - pvc_reference
        - registration_kind
        - state
        - agent_version
        - identity_fingerprint
        - proof_of_possession_status
        - probe
        - resource_version
        - created_at_unix_ms
        - updated_at_unix_ms
        - expires_at_unix_ms
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        storage_enrollment_id:
          $ref: "#/components/schemas/StorageEnrollmentId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        region:
          $ref: "#/components/schemas/RegionName"
        access_mode:
          $ref: "#/components/schemas/StorageEnrollmentAccessMode"
        pvc_reference:
          $ref: "#/components/schemas/PvcReference"
        registration_kind:
          $ref: "#/components/schemas/StorageEnrollmentRegistrationKind"
        state:
          $ref: "#/components/schemas/StorageEnrollmentState"
        agent_version:
          type: string
          minLength: 1
          maxLength: 128
        identity_fingerprint:
          type: string
          description: Agent installation 公钥 identity 的摘要，仅供审批比对；不是 mount/device fingerprint。
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
        proof_of_possession_status:
          $ref: "#/components/schemas/StorageEnrollmentProofOfPossessionStatus"
        probe:
          $ref: "#/components/schemas/StorageEnrollmentProbeSummary"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        expires_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        reviewed_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
    StorageEnrollmentProbeSummary:
      type: object
      description: Agent bootstrap 时提交的最小脱敏探测摘要，不包含挂载或设备 identity。
      additionalProperties: false
      required:
        - observed_access_mode
        - descriptor_matches
        - observed_at_unix_ms
      properties:
        observed_access_mode:
          type: string
          enum: [read_only, read_write]
        descriptor_matches:
          type: boolean
        observed_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    StorageEnrollmentProofOfPossessionStatus:
      type: string
      description: 服务端对 canonical bootstrap request 完成 Ed25519 验签后持久化的脱敏状态；不接受客户端声明。
      enum: [verified]

    StorageEnrollmentRegistrationKind:
      type: string
      description: |
        initial 建立首个 Owner，可创建缺失的 Volume，或绑定 descriptor 完全一致且 unavailable、无活动
        Owner 的既有 PVC Volume；replacement 接管既有 Owner，审批时要求 confirm_replacement=true。
      enum: [initial, replacement]

    StorageEnrollmentState:
      type: string
      description: |
        pending_approval 可被审核或在 24 小时后过期；approved 等待认证 Agent session 和健康 probe；
        enrolled 表示 enrollment 已生效。rejected 与 expired 为终态。
      enum: [pending_approval, approved, enrolled, rejected, expired]

    StorageEnrollmentAccessMode:
      type: string
      description: 0.0.1 Volume-bound Agent 必须以 RW 方式挂载业务 PVC；只读 PVC 不可进入 enrollment。
      enum: [read_write_many, read_write_once]

    PvcReference:
      type: object
      additionalProperties: false
      required: [namespace, claim_name]
      properties:
        namespace:
          $ref: "#/components/schemas/KubernetesNamespaceName"
        claim_name:
          $ref: "#/components/schemas/KubernetesPvcClaimName"

    NfsReference:
      type: object
      description: 仅在登记请求中使用；服务端不得在公开 StorageVolumeView 中回显。
      additionalProperties: false
      required: [server, export_path]
      properties:
        server:
          type: string
          minLength: 1
          maxLength: 253
        export_path:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^/.*$"

