        字段。已有 running/ready active Pre-commit 时必须先 cancel，不得用 start 覆盖。相同
        `precommit_request_id` 和 payload 返回原结果，不同 payload 返回 409。200 返回时 Pre-commit
        已持久化且可查询，扫描、哈希、上传和校验通过其状态、阶段与进度异步推进。页面查询或刷新
