        创建请求必须引用同 Tenant/Project 下已存在的 Artifact，并明确选择同 Tenant、`state=ready`
        的 StorageVolume。Workspace 是该 Artifact 某个固定 Commit 的可写派生视图，不能创建或
        重定义 Artifact；Region 由 Volume 派生，不能由调用方另行指定。
