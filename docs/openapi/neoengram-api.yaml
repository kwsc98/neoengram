      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal]
      required:
        - tenant_id
        - project_id
        - artifact_id
        - playground_id
        - storage_volume_id
        - display_name
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        playground_id:
          $ref: "#/components/schemas/PlaygroundId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        base_commit_id:
          allOf:
            - $ref: "#/components/schemas/ContentDigest"
          description: 可选的 canonical Commit 内容摘要；最小开发闭环不校验 Commit 记录存在。

    CreatePlaygroundResponse:
      type: object
      additionalProperties: false
      required: [playground, replayed]
