        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        cursor:
          $ref: "#/components/schemas/PageCursor"
        page_size:
          $ref: "#/components/schemas/PageSize"

    QueryArtifactCommitGraphResponse:
      type: object
      additionalProperties: false
      required: [graph]
      properties:
        graph:
          $ref: "#/components/schemas/CommitGraphView"

    CommitGraphView:
