          type: string
          minLength: 1
          maxLength: 4096
        description:
          $ref: "#/components/schemas/Description"
        tag_names:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TagName"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    QueryArtifactCommitDiffRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, project_id, artifact_id, commit_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        commit_id:
          $ref: "#/components/schemas/CommitId"
        base_commit_id:
          $ref: "#/components/schemas/CommitId"

    QueryArtifactCommitDiffResponse:
      type: object
      additionalProperties: false
      required: [diff]
      properties:
        diff:
          $ref: "#/components/schemas/CommitDiffView"

    CommitDiffView:
      type: object
      description: 目标 Commit 与显式 base 或其单一 parent 的公开文件级差异。
      additionalProperties: false
      required: [target_commit, summary, changes]
