          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        description:
          $ref: "#/components/schemas/Description"
        initialization:
          $ref: "#/components/schemas/ArtifactInitialization"
        head_commit_id:
          $ref: "#/components/schemas/CommitId"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    QueryArtifactCommitGraphRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, project_id, artifact_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        cursor:
