  /api/storage/enrollment/approve:
    post:
      tags: [StorageEnrollment]
      operationId: approveStorageEnrollment
      summary: 批准 Storage enrollment
      description: |
        要求 `storage.enrollment.review` 权限。仅允许批准未过期的 `pending_approval` enrollment；服务端
        必须在一个事务中执行 resource version CAS，校验冻结的 Tenant/Volume/EdgeCluster/Region/
        access mode/PVC descriptor、probe 和一 PVC 一活动 Agent 唯一约束。initial 审批
        创建缺失的 StorageVolume，或精确绑定 descriptor 完全一致且 `unavailable`、无活动 Owner 的
        既有 PVC Volume；replacement 则精确绑定同一 Tenant 下由旧 Owner 占用的既有 Volume。
        `registration_kind=replacement` 时必须显式传 `confirm_replacement=true`，否则返回 409。

        审批响应中的 StorageVolume 固定为 `state=unavailable`；审批本身不会把 Volume 标为 ready。
        Enrollment 先进入 `approved`，只有后续认证 Agent session 和健康 probe 才能进入 `enrolled` 并
        使 Volume 成为 ready。公开响应不包含 bootstrap token、证书、AgentId 或 session identity。

        `approval_request_id` 是稳定 mutation identity，并与 `rejection_request_id` 共享 Tenant 级 decision
        request identity 命名空间。相同 ID 和 payload 幂等重放；跨审核动作复用、不同 payload、stale
        `expected_resource_version`、非 pending_approval 状态或 PVC 已绑定另一活动 Agent 均返回 409。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveStorageEnrollmentRequest"
            example:
              tenant_id: tenant-a
              storage_enrollment_id: storage-enrollment-vision-01
              approval_request_id: approve-storage-enrollment-vision-01
              expected_resource_version: "1"
              confirm_replacement: false
      responses:
        "200":
          description: enrollment 已批准或相同审批被重放
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveStorageEnrollmentResponse"
              example:
                enrollment:
                  tenant_id: tenant-a
                  storage_enrollment_id: storage-enrollment-vision-01
                  storage_volume_id: volume-vision
                  display_name: Vision dataset PVC
                  edge_cluster_id: cluster-cn-east-1
                  region: cn-east-1
                  access_mode: read_write_many
                  pvc_reference:
                    namespace: neoengram-data
                    claim_name: vision-data
                  registration_kind: initial
                  state: approved
                  agent_version: 0.0.1
                  identity_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  proof_of_possession_status: verified
                  probe:
                    observed_access_mode: read_write
                    descriptor_matches: true
                    observed_at_unix_ms: "1785168060000"
                  resource_version: "2"
                  created_at_unix_ms: "1785168060000"
                  expires_at_unix_ms: "1785254460000"
                  reviewed_at_unix_ms: "1785168120000"
                  updated_at_unix_ms: "1785168120000"
                storage_volume:
                  tenant_id: tenant-a
                  storage_volume_id: volume-vision
                  display_name: Vision dataset PVC
                  edge_cluster_id: cluster-cn-east-1
                  region: cn-east-1
                  backend_type: pvc
                  access_mode: read_write_many
                  allowed_delivery_modes: [fuse, copy]
                  hardlink_policy: disabled
                  max_whole_file_bytes: "107374182400"
                  copy_reserve_bytes: "10737418240"
                  pvc_reference:
                    namespace: neoengram-data
                    claim_name: vision-data
                  state: unavailable
                  resource_version: "1"
                  lifecycle:
                    state: active
                    generation: "1"
                  created_at_unix_ms: "1785168120000"
                  updated_at_unix_ms: "1785168120000"
                request_replayed: false
                execution_reused: false
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/StorageEnrollmentNotFoundProblem"
        "409":
          $ref: "#/components/responses/StorageEnrollmentConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

