  /api/storage/enrollment/reject:
    post:
      tags: [StorageEnrollment]
      operationId: rejectStorageEnrollment
      summary: 拒绝 Storage enrollment
      description: |
        要求 `storage.enrollment.review` 权限。仅允许拒绝未过期的 `pending_approval` enrollment；服务端使用
        `expected_resource_version` 执行 CAS 并记录认证 actor 的审计事件。拒绝是终态，不签发 Agent
        证书；0.0.1 永久退休该 candidate 的 installation identity 与公钥，再次申请需要初始化新的
        Agent 状态身份、密钥和 bootstrap token。

        可选 `reason` 仅写入认证 actor 的受控审计记录，不进入 StorageEnrollmentView、公开响应或日志。
        `rejection_request_id` 是稳定 mutation identity，并与 `approval_request_id` 共享 Tenant 级 decision
        request identity 命名空间。相同 ID 和 payload 幂等重放；跨审核动作复用、不同 payload、stale
        resource version 或非 pending_approval 状态返回 409。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectStorageEnrollmentRequest"
            example:
              tenant_id: tenant-a
              storage_enrollment_id: storage-enrollment-vision-01
              rejection_request_id: reject-storage-enrollment-vision-01
              expected_resource_version: "1"
              reason: PVC descriptor 与本次部署变更窗口不匹配
      responses:
        "200":
          description: enrollment 已拒绝或相同拒绝请求被重放
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectStorageEnrollmentResponse"
              example:
                enrollment:
                  tenant_id: tenant-a
                  storage_enrollment_id: storage-enrollment-vision-01
                  storage_volume_id: volume-vision
                  display_name: Vision dataset PVC
                  edge_cluster_id: cluster-cn-east-1
                  region: cn-east-1
                  access_mode: read_write_many
                  pvc_reference:
                    namespace: neoengram-data
                    claim_name: vision-data
                  registration_kind: initial
                  state: rejected
                  agent_version: 0.0.1
                  identity_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  proof_of_possession_status: verified
                  probe:
                    observed_access_mode: read_write
                    descriptor_matches: false
                    observed_at_unix_ms: "1785168060000"
                  resource_version: "2"
                  created_at_unix_ms: "1785168060000"
                  expires_at_unix_ms: "1785254460000"
                  reviewed_at_unix_ms: "1785168120000"
                  updated_at_unix_ms: "1785168120000"
                request_replayed: false
                execution_reused: false
        "401":
