          $ref: "#/components/schemas/ArtifactInitialization"

    ArtifactInitialization:
      oneOf:
        - $ref: "#/components/schemas/EmptyArtifactInitialization"
        - $ref: "#/components/schemas/DerivedArtifactInitialization"
      discriminator:
        propertyName: mode
