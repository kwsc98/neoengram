        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"
        retry_request_id:
          $ref: "#/components/schemas/ResourceId"

    RetrySnapshotDeliveryResponse:
      type: object
      additionalProperties: false
      required: [snapshot, replayed]
      properties:
        snapshot:
          $ref: "#/components/schemas/SnapshotView"
