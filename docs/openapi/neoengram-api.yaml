          type: boolean

    PlaygroundState:
      type: string
      enum: [creating, ready, abnormal]

    PlaygroundView:
      type: object
      description: |
        Playground 的 Region 始终由所选 StorageVolume 派生。主状态只表达工作区可用性；
        scanning、hashing、uploading 和 validating 仅属于独立 Pre-commit 流程。
