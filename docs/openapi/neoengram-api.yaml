        - gateway_pool.update
        - gateway_pool.drain
        - gateway_pool.delete
        - gateway_replica.create
        - gateway_replica.activate
        - gateway_replica.drain
        - gateway_replica.revoke
        - gateway_replica.delete
        - s3_credential.create
        - s3_credential.revoke

    TaskPurpose:
      type: string
      enum: [copy, repair]

    TaskState:
      type: string
      enum: [queued, running, waiting, verifying, succeeded, stalled, failed, cancelling, cancelled]

    TaskProgressView:
      type: object
      additionalProperties: false
      required: [completed, total, completed_bytes, total_bytes]
      properties:
        completed: { $ref: "#/components/schemas/CanonicalU64" }
        total: { $ref: "#/components/schemas/CanonicalU64" }
        completed_bytes: { $ref: "#/components/schemas/CanonicalU64" }
        total_bytes: { $ref: "#/components/schemas/CanonicalU64" }

    TaskIssueView:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string, minLength: 1, maxLength: 256 }
        message: { type: string, minLength: 1, maxLength: 512 }
        retryable: { type: boolean }
        detail: { type: string, minLength: 1, maxLength: 4096 }

    TaskResourceRefView:
      type: object
      additionalProperties: false
      required: [resource_kind, resource_id]
      properties:
        resource_kind: { type: string, minLength: 1, maxLength: 128 }
        resource_id: { type: string, minLength: 1, maxLength: 256 }

    TaskResourceLinkView:
      type: object
      additionalProperties: false
      required: [resource_kind, resource_id, role]
      properties:
        resource_kind: { type: string, minLength: 1, maxLength: 128 }
        resource_id: { type: string, minLength: 1, maxLength: 256 }
        role: { type: string, enum: [primary, source, target, related] }

    TaskStageView:
      type: object
      additionalProperties: false
      required: [stage_key, stage_kind, ordinal, dependencies, state, stage_attempt, progress, created_at_unix_ms, updated_at_unix_ms, resource_version]
      properties:
        stage_key: { type: string, minLength: 1, maxLength: 256 }
        stage_kind: { type: string, minLength: 1, maxLength: 256 }
        ordinal: { $ref: "#/components/schemas/CanonicalU64" }
        dependencies: { type: array, items: { type: string, minLength: 1, maxLength: 256 }, uniqueItems: true }
        state: { type: string, enum: [pending, ready, running, waiting, verifying, succeeded, skipped, no_op, stalled, failed, cancelling, cancelled] }
        stage_attempt: { $ref: "#/components/schemas/CanonicalU64" }
        outcome: { type: string, enum: [succeeded, skipped, no_op, reused, failed, cancelled] }
        progress: { $ref: "#/components/schemas/TaskProgressView" }
        detail_kind: { type: string, minLength: 1, maxLength: 256 }
        detail_id: { type: string, minLength: 1, maxLength: 256 }
        issue: { $ref: "#/components/schemas/TaskIssueView" }
        created_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        updated_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        started_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        finished_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        resource_version: { $ref: "#/components/schemas/CanonicalU64" }

    TaskCompletionView:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [succeeded, cancelled, failed] }
        finished_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }

    TaskView:
      type: object
      additionalProperties: false
      required: [task_id, intent_kind, state, tenant_id, primary_resource, resource_links, execution_id, execution_key_digest, execution_reused, current_stage, stages, request_id, request_digest, actor, attempt, progress, deadline_unix_ms, created_at_unix_ms, updated_at_unix_ms, resource_version, origin, executable]
      properties:
        task_id: { $ref: "#/components/schemas/TaskId" }
        intent_kind: { $ref: "#/components/schemas/TaskIntent" }
        purpose: { $ref: "#/components/schemas/TaskPurpose" }
        state: { $ref: "#/components/schemas/TaskState" }
        tenant_id: { $ref: "#/components/schemas/TenantId" }
        primary_resource: { $ref: "#/components/schemas/TaskResourceRefView" }
        resource_links: { type: array, items: { $ref: "#/components/schemas/TaskResourceLinkView" } }
        execution_id: { type: string, minLength: 1, maxLength: 256 }
        execution_key_digest: { $ref: "#/components/schemas/ContentDigest" }
        execution_reused: { type: boolean }
        current_stage: { $ref: "#/components/schemas/TaskStageView" }
        stages: { type: array, items: { $ref: "#/components/schemas/TaskStageView" } }
        completion: { $ref: "#/components/schemas/TaskCompletionView" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        request_digest: { $ref: "#/components/schemas/ContentDigest" }
        actor: { type: string, minLength: 1, maxLength: 256 }
        attempt: { $ref: "#/components/schemas/CanonicalU64" }
        progress: { $ref: "#/components/schemas/TaskProgressView" }
        deadline_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        issue: { $ref: "#/components/schemas/TaskIssueView" }
        created_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        updated_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        started_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        finished_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        resource_version: { $ref: "#/components/schemas/CanonicalU64" }
        origin: { type: string, enum: [user, system] }
        executable: { type: boolean }

    TaskAttemptView:
      type: object
      additionalProperties: false
      required: [attempt_id, task_id, attempt, state, current_stage_key, created_at_unix_ms, updated_at_unix_ms, resource_version]
      properties:
        attempt_id: { $ref: "#/components/schemas/TaskAttemptId" }
        task_id: { $ref: "#/components/schemas/TaskId" }
        attempt: { $ref: "#/components/schemas/CanonicalU64" }
        state: { $ref: "#/components/schemas/TaskState" }
        current_stage_key: { type: string, minLength: 1, maxLength: 256 }
        created_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        updated_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        started_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        finished_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        issue: { $ref: "#/components/schemas/TaskIssueView" }
        resource_version: { $ref: "#/components/schemas/CanonicalU64" }

    TaskEventView:
      type: object
      additionalProperties: false
      required: [event_id, task_id, sequence, attempt, kind, state, actor, occurred_at_unix_ms, resource_version]
      properties:
        event_id: { $ref: "#/components/schemas/TaskEventId" }
        task_id: { $ref: "#/components/schemas/TaskId" }
        sequence: { $ref: "#/components/schemas/CanonicalU64" }
        attempt: { $ref: "#/components/schemas/CanonicalU64" }
        kind: { type: string, minLength: 1, maxLength: 64 }
        state: { $ref: "#/components/schemas/TaskState" }
        from_state: { $ref: "#/components/schemas/TaskState" }
        to_state: { $ref: "#/components/schemas/TaskState" }
        actor: { type: string, minLength: 1, maxLength: 256 }
        message: { type: string, minLength: 1, maxLength: 4096 }
        issue: { $ref: "#/components/schemas/TaskIssueView" }
        progress: { $ref: "#/components/schemas/TaskProgressView" }
        occurred_at_unix_ms: { $ref: "#/components/schemas/UnixMillis" }
        resource_version: { $ref: "#/components/schemas/CanonicalU64" }

    QueryTaskListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TaskView" } }
        next_cursor: { type: string, minLength: 1, maxLength: 256 }

    QueryTaskResponse:
      type: object
      additionalProperties: false
      required: [task, attempts, events]
      properties:
        task: { $ref: "#/components/schemas/TaskView" }
        attempts: { type: array, items: { $ref: "#/components/schemas/TaskAttemptView" } }
        events: { type: array, items: { $ref: "#/components/schemas/TaskEventView" } }

    QueryTaskEventListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TaskEventView" } }
        next_cursor: { $ref: "#/components/schemas/CanonicalU64" }

    TaskSummaryView:
      type: object
      additionalProperties: false
      required: [total, queued, running, waiting, verifying, succeeded, stalled, failed, cancelling, cancelled]
      properties:
        total: { $ref: "#/components/schemas/CanonicalU64" }
        queued: { $ref: "#/components/schemas/CanonicalU64" }
        running: { $ref: "#/components/schemas/CanonicalU64" }
        waiting: { $ref: "#/components/schemas/CanonicalU64" }
        verifying: { $ref: "#/components/schemas/CanonicalU64" }
        succeeded: { $ref: "#/components/schemas/CanonicalU64" }
        stalled: { $ref: "#/components/schemas/CanonicalU64" }
        failed: { $ref: "#/components/schemas/CanonicalU64" }
        cancelling: { $ref: "#/components/schemas/CanonicalU64" }
        cancelled: { $ref: "#/components/schemas/CanonicalU64" }

    QueryTaskSummaryResponse:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/TaskSummaryView" }

    TaskMutationResponse:
      type: object
      additionalProperties: false
      required: [task, request_replayed, execution_reused]
      properties:
        task: { $ref: "#/components/schemas/TaskView" }
        request_replayed: { type: boolean }
        execution_reused: { type: boolean }

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details，并携带 NeoEngram 稳定错误字段。
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - request_id
        - retryable
      properties:
        type:
          type: string
          format: uri-reference
          pattern: "^urn:neoengram:problem:[a-z0-9-]+$"
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 4096
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ErrorCode"
        request_id:
          $ref: "#/components/schemas/RequestId"
        retryable:
          type: boolean
        retry_after_ms:
          $ref: "#/components/schemas/CanonicalU64"
        violations:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/FieldViolation"

    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 256
        reason:
          type: string
          minLength: 1
          maxLength: 1024

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    TenantId:
      $ref: "#/components/schemas/ResourceId"
    StorageVolumeId:
      $ref: "#/components/schemas/ResourceId"
    StorageEnrollmentId:
      $ref: "#/components/schemas/ResourceId"
    StorageEnrollmentTokenId:
      $ref: "#/components/schemas/ResourceId"
    EdgeClusterId:
      $ref: "#/components/schemas/ResourceId"
    GatewayPoolId:
      $ref: "#/components/schemas/ResourceId"
    GatewayReplicaId:
      $ref: "#/components/schemas/ResourceId"
    ProjectId:
      $ref: "#/components/schemas/ResourceId"
    ArtifactId:
      $ref: "#/components/schemas/ResourceId"
    WorkspaceId:
      $ref: "#/components/schemas/ResourceId"
    CommitId:
      $ref: "#/components/schemas/ContentDigest"
    PreCommitId:
      $ref: "#/components/schemas/ResourceId"
    SnapshotId:
      $ref: "#/components/schemas/ResourceId"
    SnapshotDeliveryId:
      $ref: "#/components/schemas/ResourceId"
    S3AccessPointId:
      $ref: "#/components/schemas/ResourceId"
    S3CredentialId:
      $ref: "#/components/schemas/ResourceId"
    DeletionId:
      $ref: "#/components/schemas/ResourceId"
    RetentionHoldId:
      $ref: "#/components/schemas/ResourceId"
    TaskId:
      $ref: "#/components/schemas/ResourceId"
    TaskAttemptId:
      $ref: "#/components/schemas/ResourceId"
    TaskEventId:
      $ref: "#/components/schemas/ResourceId"
    RequestId:
      $ref: "#/components/schemas/ResourceId"

    StorageEnrollmentBootstrapToken:
      type: string
      description: 15 分钟有效且只能成功消费一次的 opaque secret；不得写入日志、审计或其他公开 DTO。
      readOnly: true
      minLength: 32
      maxLength: 2048
      pattern: "^[A-Za-z0-9._~-]+$"

    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,127})$"

    ErrorCode:
      type: string
      minLength: 1
      maxLength: 96
      pattern: "^[A-Z][A-Z0-9_]{0,95}$"

    DisplayName:
      type: string
      minLength: 1
      maxLength: 128

    Description:
      type: string
      maxLength: 2048

    RegionName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"

    StorageBackendType:
      type: string
      enum: [pvc, nfs]

    StorageAccessMode:
      type: string
      enum: [read_write_many, read_write_once, read_only_many]

    KubernetesNamespaceName:
      type: string
      description: Kubernetes DNS-1123 label；Namespace 最长 63 字符且不允许点号。
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$"

    KubernetesPvcClaimName:
      type: string
      description: Kubernetes DNS-1123 subdomain；每个 label 最长 63 字符，完整名称最长 253 字符。
      minLength: 1
      maxLength: 253
      pattern: '^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$'

    StorageVolumeState:
      type: string
      enum: [ready, degraded, unavailable]

    S3AccessPointState:
      type: string
      enum: [active, disabled, deleted]

    S3CredentialState:
      type: string
      enum: [active, revoked, expired]

    S3ObjectEntryType:
      type: string
      enum: [object, prefix]

    S3BucketName:
      type: string
      description: S3 DNS-compatible bucket name; names are globally unique across the control plane.
      minLength: 3
      maxLength: 63
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$'

    S3ObjectKey:
      $ref: "#/components/schemas/LogicalPath"

    S3ObjectKeyPrefix:
      type: string
      maxLength: 1024

    PermissionName:
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$'
      enum:
        - task.read
        - task.manage
        - tenant.read
        - tenant.create
        - tenant.admin
        - storage.read
        - storage.create
        - storage.enrollment.create
        - storage.enrollment.read
        - storage.enrollment.review
        - artifact.read
        - artifact.create
        - artifact.commit.replicate
        - project.read
        - project.create
        - workspace.read
        - workspace.create
        - snapshot.read
        - snapshot.create
        - s3.access.read
        - s3.access.manage
        - resource.lifecycle.read
        - resource.lifecycle.manage
        - retention.manage
        - gateway.read
        - gateway.manage

    TagName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^(?!refs/)[A-Za-z0-9](?:[A-Za-z0-9._/-]{0,127})$"

    PageCursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: 服务端生成、与资源 scope、筛选条件和排序绑定的不透明分页 token。

    PageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 50

    S3PageSize:
      type: integer
      minimum: 1
      maximum: 1000
      default: 100

    SearchQuery:
      type: string
      minLength: 1
      maxLength: 256

    ContentDigest:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"

    CanonicalU64:
      type: string
      minLength: 1
      maxLength: 20
      pattern: "^(0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-5])$"

    DecimalU64:
      allOf:
        - $ref: "#/components/schemas/CanonicalU64"
      description: 无符号整数，编码为 canonical decimal JSON string。

    PositiveCanonicalU64:
      allOf:
        - $ref: "#/components/schemas/CanonicalU64"
        - pattern: "^[1-9][0-9]{0,19}$"
      description: 大于零且不超过 u64 最大值的 canonical decimal JSON string。

    UnixMillis:
      allOf:
        - $ref: "#/components/schemas/CanonicalU64"
      description: Unix 毫秒时间戳，编码为 canonical decimal JSON string。

    LogicalPath:
      type: string
      minLength: 1
      description: |
        NFC 规范化、使用 `/` 分隔的 repository-relative portable path；不能包含绝对路径、
        空/dot component、反斜杠、NUL、平台保留字符或 NeoEngram 内部名称。

    IndexVersion:
      type: object
      additionalProperties: false
      required: [revision, digest]
      properties:
        revision:
          $ref: "#/components/schemas/CanonicalU64"
        digest:
          $ref: "#/components/schemas/ContentDigest"
