          $ref: "#/components/schemas/CommitGraphView"

    CommitGraphView:
      type: object
      additionalProperties: false
      required: [graph_version, nodes]
      properties:
        graph_version:
          $ref: "#/components/schemas/CanonicalU64"
        head_commit_id:
          $ref: "#/components/schemas/CommitId"
