          $ref: "#/components/schemas/ArtifactInitialization"

    ArtifactInitialization:
      oneOf:
        - $ref: "#/components/schemas/EmptyArtifactInitialization"
        - $ref: "#/components/schemas/DerivedArtifactInitialization"
      discriminator:
        propertyName: mode
        mapping:
          empty: "#/components/schemas/EmptyArtifactInitialization"
          derived: "#/components/schemas/DerivedArtifactInitialization"

    EmptyArtifactInitialization:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          const: empty

    DerivedArtifactInitialization:
      type: object
      description: |
        保留的派生初始化形态。来源 Artifact 必须属于当前 Tenant，来源 Commit 必须属于显式来源
        Project/Artifact；当前 capability 无法验证 Commit 归属，因此 create 会稳定返回 409。
      additionalProperties: false
      required: [mode, source_project_id, source_artifact_id, source_commit_id]
      properties:
        mode:
          type: string
          const: derived
        source_project_id:
          $ref: "#/components/schemas/ProjectId"
        source_artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        source_commit_id:
          $ref: "#/components/schemas/CommitId"

    CreateArtifactResponse:
      type: object
      additionalProperties: false
      required: [artifact, request_replayed, execution_reused]
      properties:
        artifact:
          $ref: "#/components/schemas/ArtifactView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    ArtifactView:
      type: object
      description: |
        Artifact 是不绑定 Region 或 StorageVolume 的版本化逻辑数据资产。初始化血缘只暴露
        同 Tenant 的逻辑来源，不暴露 ArtifactPlacement、Manifest 或物理对象位置。`artifact_id`
        在 Tenant 内唯一，`project_id` 表示其唯一业务归属。
      additionalProperties: false
      required:
