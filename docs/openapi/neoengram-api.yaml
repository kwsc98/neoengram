openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: NeoEngram Public API
  version: 1.0.0
  summary: NeoEngram 用户、CLI 和 UI 使用的非 REST JSON API 契约
  description: |
    这是 NeoEngram 中心服务的首版公开 API 设计契约。`neoengram-server` 默认已实现版本、健康和
    Managed Add Job 六个接口；启用 Agent enrollment 时还实现 token create、enrollment
    list/query、approve 和 reject。其余 operation 仍是目标契约，不表示已经可以访问。

    业务方法使用“模块 / 子域 / 动作”路径，并通过普通 JSON 请求和响应调用；
    路径不包含版本号。除版本查询和健康检查外，调用方必须发送
    `NeoEngram-API-Version: 1` 和 Bearer JWT。

    Agent API 不属于本 OpenAPI。独立 listener 已实现 bootstrap token 消费和签名状态轮询；双向
    `application/json-seq` session、证书和 heartbeat 尚未实现，其消息、分页和重放契约由
    `neoengram-protocol` JSON Schema 与中心 Agent 架构文档定义。Storage enrollment 仅公开 Tenant
    管理员创建一次性 bootstrap token 和审批 Agent 主动提交的脱敏申请。

    本契约只公开 P0 用户资源和脱敏逻辑元数据。Dashboard 聚合、容量与底层诊断、用途与保留
    策略、Lease/Mount、Agent/assignment、fencing、Manifest/Chunk、文件内容 digest、对象位置和
    物理路径不属于本 OpenAPI；不得由客户端扩展字段模拟为生产能力。
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0

servers:
  - url: /
    description: 与当前 neoengram-server 用户 API origin 相同

tags:
  - name: System
    description: API 版本和兼容能力查询
  - name: Tenant
    description: 当前 principal 可见的租户与平台级租户创建方法
  - name: Storage
    description: 租户登记的 StorageVolume 查询与创建方法
  - name: StorageEnrollment
    description: Tenant 管理员冻结待接入 PVC descriptor、创建 bootstrap token 并审核脱敏 enrollment 记录
  - name: Project
    description: 租户内只读 Project 查询方法
  - name: Artifact
    description: 租户内 Artifact 创建、查询，以及 Commit 图和文件 Diff 查询方法
  - name: Playground
    description: 租户内 Playground 创建、查询和 Commit 方法
  - name: Snapshot
    description: 绑定 Artifact Commit 的只读 Snapshot 创建与查询方法
  - name: Job
    description: 用户发起和查询的中心权威 Job 方法
  - name: Health
    description: 供进程管理器和负载均衡器调用的标准健康探针

paths:
  /api/system/version/query:
    post:
      tags: [System]
      operationId: queryApiVersion
      summary: 查询 API 和 Agent 协议版本
      security: []
      description: |
        返回当前服务理解的公开 API 版本和 Agent wire protocol 版本。该方法用于
        版本协商，因此不要求 `NeoEngram-API-Version` 或认证。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
            example: {}
      responses:
        "200":
          description: 版本与能力信息
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVersionResponse"
              example:
                api_versions: [1]
                agent_protocol_versions: [1]
                capabilities:
                  - managed_add
                  - sqlite_authority
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

  /api/tenant/list/query:
    post:
      tags: [Tenant]
      operationId: queryTenantList
      summary: 查询当前用户可见租户
      description: |
        分页返回认证 principal 已获授权的租户。列表不会返回 principal 无权访问的租户，
        `can_create_tenant` 只用于界面能力提示，服务端仍必须在创建时重新授权。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryTenantListRequest"
            example:
              page_size: 50
              query: research
      responses:
        "200":
          description: 当前 principal 可见的租户页
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTenantListResponse"
              example:
                items:
                  - tenant_id: tenant-a
                    display_name: 研究数据平台
                    description: 研究团队的受管数据空间
                    resource_version: "3"
                    created_at_unix_ms: "1785167000000"
                    updated_at_unix_ms: "1785167600000"
                    permissions: [tenant.read, artifact.read, job.create]
                next_cursor: tenant-page-2
                can_create_tenant: true
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /api/tenant/query:
    post:
      tags: [Tenant]
      operationId: queryTenant
      summary: 查询单个租户
      description: 查询当前 principal 可见的租户视图；不可见与不存在统一返回 404。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryTenantRequest"
            example:
              tenant_id: tenant-a
      responses:
        "200":
          description: 可见租户的当前视图
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryTenantResponse"
              example:
                tenant:
                  tenant_id: tenant-a
                  display_name: 研究数据平台
                  description: 研究团队的受管数据空间
                  resource_version: "3"
                  created_at_unix_ms: "1785167000000"
                  updated_at_unix_ms: "1785167600000"
                  permissions: [tenant.read, artifact.read, job.create]
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/ResourceNotFoundProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /api/tenant/create:
    post:
      tags: [Tenant]
      operationId: createTenant
      summary: 创建租户
      description: |
        仅平台管理员可调用。相同 tenant ID 和相同 canonical 创建内容返回既有租户并标记重放；
        相同 tenant ID 对应不同内容时返回 `TENANT_ID_REUSED`。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
            example:
              tenant_id: tenant-lab
              display_name: 算法实验室
              description: 算法团队的受管数据空间
      responses:
        "200":
          description: 租户已创建或相同创建请求被重放
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
              examples:
                created:
                  value:
                    tenant:
                      tenant_id: tenant-lab
                      display_name: 算法实验室
                      description: 算法团队的受管数据空间
                      resource_version: "1"
                      created_at_unix_ms: "1785168000000"
                      updated_at_unix_ms: "1785168000000"
                      permissions:
                        [tenant.admin, tenant.read, artifact.read, job.create]
                    replayed: false
                replayed:
                  value:
                    tenant:
                      tenant_id: tenant-lab
                      display_name: 算法实验室
                      description: 算法团队的受管数据空间
                      resource_version: "1"
                      created_at_unix_ms: "1785168000000"
                      updated_at_unix_ms: "1785168000000"
                      permissions:
                        [tenant.admin, tenant.read, artifact.read, job.create]
                    replayed: true
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "409":
          $ref: "#/components/responses/TenantConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /api/storage/volume/list/query:
    post:
      tags: [Storage]
      operationId: queryStorageVolumeList
      summary: 查询租户内 StorageVolume
      description: |
        分页返回租户登记的逻辑存储卷。返回值不包含挂载路径、凭据、Agent ownership
        或 fencing 信息；region 和 EdgeCluster 用于创建资源时选择放置位置。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryStorageVolumeListRequest"
            example:
              tenant_id: tenant-a
              page_size: 50
      responses:
        "200":
          description: StorageVolume 页
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStorageVolumeListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/ResourceNotFoundProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /api/storage/volume/query:
    post:
      tags: [Storage]
      operationId: queryStorageVolume
      summary: 查询单个 StorageVolume
      description: 按 tenant 和稳定逻辑存储 ID 返回可用于资源放置选择的公开视图。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryStorageVolumeRequest"
      responses:
        "200":
          description: StorageVolume 当前公开视图
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStorageVolumeResponse"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/ResourceNotFoundProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /api/storage/volume/create:
    post:
      tags: [Storage]
      operationId: createStorageVolume
      summary: 登记 StorageVolume
      description: |
        在租户内登记已有 PVC 或 NFS 后端，不创建 Kubernetes PV/PVC 或 NFS 资源。
        region 由 StorageVolume 固定，后续资源创建只提交 storage_volume_id。
        首次登记的 Volume 响应必须为 `state=unavailable`；未经受信 Agent session 和健康挂载观测，
        不得自动成为 `ready`。相同请求重放只返回当前权威视图，不改变或提升 Volume 状态。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageVolumeRequest"
            example:
              tenant_id: tenant-a
              storage_volume_id: volume-vision
              display_name: 视觉数据 PVC
              edge_cluster_id: cluster-cn-east-1
              region: cn-shanghai
              backend_type: pvc
              access_mode: read_write_many
              pvc_reference:
                namespace: neoengram-data
                claim_name: vision-data
      responses:
        "200":
          description: 首次登记返回 unavailable；相同请求重放返回当前权威状态且不触发状态提升
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStorageVolumeResponse"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/ResourceNotFoundProblem"
        "409":
          $ref: "#/components/responses/MutationConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"

  /api/storage/enrollment/token/create:
    post:
      tags: [StorageEnrollment]
      operationId: createStorageEnrollmentToken
      summary: 创建 Storage enrollment bootstrap token
      description: |
        要求 `storage.enrollment.create` 权限。为尚未接入或需要替换 Agent 的 PVC 创建 15 分钟有效、
        只能被内部 Agent bootstrap 成功消费一次的 opaque token；无需预先登记 StorageVolume。token
        冻结并绑定 tenant、StorageVolume ID、display name、EdgeCluster、Region、access mode 和 PVC
        descriptor；Agent 提交的 descriptor 或 probe 不匹配时审批不得通过。服务端只存储受保护的
        token 材料。

        `token_request_id` 是稳定 mutation identity；相同 ID 和完全相同 payload 重放原响应并将
        `replayed` 设为 true，不同 payload 返回 409。原始 `bootstrap_token` 只允许出现在本方法的
        成功响应中，不能进入 enrollment 列表、查询、审批、审计或日志。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageEnrollmentTokenRequest"
            example:
              tenant_id: tenant-a
              token_request_id: storage-enrollment-token-vision-01
              storage_volume_id: volume-vision
              display_name: Vision dataset PVC
              edge_cluster_id: cluster-cn-east-1
              region: cn-east-1
              access_mode: read_write_many
              pvc_reference:
                namespace: neoengram-data
                claim_name: vision-data
      responses:
        "200":
          description: bootstrap token 已创建或相同请求被重放
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateStorageEnrollmentTokenResponse"
              examples:
                created:
                  value:
                    token_id: storage-enrollment-token-01
                    bootstrap_token: ngenr_v1_hQ7Bv2jL0pK9Xz4cN6mR8sT1wY3aD5fG
                    volume_descriptor_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    expires_at_unix_ms: "1785168900000"
                    replayed: false
                replayed:
                  value:
                    token_id: storage-enrollment-token-01
                    bootstrap_token: ngenr_v1_hQ7Bv2jL0pK9Xz4cN6mR8sT1wY3aD5fG
                    volume_descriptor_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    expires_at_unix_ms: "1785168900000"
                    replayed: true
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/ResourceNotFoundProblem"
        "409":
          $ref: "#/components/responses/StorageEnrollmentConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

  /api/storage/enrollment/list/query:
    post:
      tags: [StorageEnrollment]
      operationId: queryStorageEnrollmentList
      summary: 查询 Storage enrollment 列表
      description: |
        要求 `storage.enrollment.read` 权限。分页返回当前 Tenant 内 Agent 已主动提交的脱敏 enrollment
        记录；不可见 Tenant 与不存在 Tenant 使用相同的 404 语义。响应不包含 bootstrap token、CSR、
        证书、PVC UID、mount path、AgentId/MountId、session、lease 或 fencing 信息。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryStorageEnrollmentListRequest"
            example:
              tenant_id: tenant-a
              state: pending_approval
              page_size: 50
      responses:
        "200":
          description: Storage enrollment 页
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStorageEnrollmentListResponse"
              example:
                items:
                  - tenant_id: tenant-a
                    storage_enrollment_id: storage-enrollment-vision-01
                    storage_volume_id: volume-vision
                    display_name: Vision dataset PVC
                    edge_cluster_id: cluster-cn-east-1
                    region: cn-east-1
                    access_mode: read_write_many
                    pvc_reference:
                      namespace: neoengram-data
                      claim_name: vision-data
                    registration_kind: initial
                    state: pending_approval
                    agent_version: 0.0.1
                    identity_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    proof_of_possession_status: verified
                    probe:
                      observed_access_mode: read_write
                      descriptor_matches: true
                      protocol_compatible: true
                      observed_at_unix_ms: "1785168060000"
                    resource_version: "1"
                    created_at_unix_ms: "1785168060000"
                    expires_at_unix_ms: "1785254460000"
                    updated_at_unix_ms: "1785168060000"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/ResourceNotFoundProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

  /api/storage/enrollment/query:
    post:
      tags: [StorageEnrollment]
      operationId: queryStorageEnrollment
      summary: 查询单个 Storage enrollment
      description: |
        要求 `storage.enrollment.read` 权限。按 Tenant 和 enrollment ID 返回脱敏审批视图；不存在与
        跨 Tenant 不可见统一返回 404。该方法不返回任何 bootstrap 或 Agent credential 材料。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryStorageEnrollmentRequest"
            example:
              tenant_id: tenant-a
              storage_enrollment_id: storage-enrollment-vision-01
      responses:
        "200":
          description: Storage enrollment 当前脱敏视图
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryStorageEnrollmentResponse"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/StorageEnrollmentNotFoundProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

  /api/storage/enrollment/approve:
    post:
      tags: [StorageEnrollment]
      operationId: approveStorageEnrollment
      summary: 批准 Storage enrollment
      description: |
        要求 `storage.enrollment.review` 权限。仅允许批准未过期的 `pending_approval` enrollment；服务端
        必须在一个事务中执行 resource version CAS，校验冻结的 Tenant/Volume/EdgeCluster/Region/
        access mode/PVC descriptor、probe、协议兼容性和一 PVC 一活动 Agent 唯一约束。initial 审批
        创建缺失的 StorageVolume，或精确绑定 descriptor 完全一致且 `unavailable`、无活动 Owner 的
        既有 PVC Volume；replacement 则精确绑定同一 Tenant 下由旧 Owner 占用的既有 Volume。
        `registration_kind=replacement` 时必须显式传 `confirm_replacement=true`，否则返回 409。

        审批响应中的 StorageVolume 固定为 `state=unavailable`；审批本身不会把 Volume 标为 ready。
        Enrollment 先进入 `approved`，只有后续认证 Agent session 和健康 probe 才能进入 `enrolled` 并
        使 Volume 成为 ready。公开响应不包含 bootstrap token、证书、AgentId 或 session identity。

        `approval_request_id` 是稳定 mutation identity，并与 `rejection_request_id` 共享 Tenant 级 decision
        request identity 命名空间。相同 ID 和 payload 幂等重放；跨审核动作复用、不同 payload、stale
        `expected_resource_version`、非 pending_approval 状态或 PVC 已绑定另一活动 Agent 均返回 409。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveStorageEnrollmentRequest"
            example:
              tenant_id: tenant-a
              storage_enrollment_id: storage-enrollment-vision-01
              approval_request_id: approve-storage-enrollment-vision-01
              expected_resource_version: "1"
              confirm_replacement: false
      responses:
        "200":
          description: enrollment 已批准或相同审批被重放
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveStorageEnrollmentResponse"
              example:
                enrollment:
                  tenant_id: tenant-a
                  storage_enrollment_id: storage-enrollment-vision-01
                  storage_volume_id: volume-vision
                  display_name: Vision dataset PVC
                  edge_cluster_id: cluster-cn-east-1
                  region: cn-east-1
                  access_mode: read_write_many
                  pvc_reference:
                    namespace: neoengram-data
                    claim_name: vision-data
                  registration_kind: initial
                  state: approved
                  agent_version: 0.0.1
                  identity_fingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  proof_of_possession_status: verified
                  probe:
                    observed_access_mode: read_write
                    descriptor_matches: true
                    protocol_compatible: true
                    observed_at_unix_ms: "1785168060000"
                  resource_version: "2"
                  created_at_unix_ms: "1785168060000"
                  expires_at_unix_ms: "1785254460000"
                  reviewed_at_unix_ms: "1785168120000"
                  updated_at_unix_ms: "1785168120000"
                storage_volume:
                  tenant_id: tenant-a
                  storage_volume_id: volume-vision
                  display_name: Vision dataset PVC
                  edge_cluster_id: cluster-cn-east-1
                  region: cn-east-1
                  backend_type: pvc
                  access_mode: read_write_many
                  pvc_reference:
                    namespace: neoengram-data
