    QuerySnapshotActivityListRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, snapshot_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"
        cursor:
          $ref: "#/components/schemas/PageCursor"
        page_size:
          $ref: "#/components/schemas/PageSize"

    QuerySnapshotActivityListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SnapshotActivityView"
        next_cursor:
          $ref: "#/components/schemas/PageCursor"

    SnapshotActivityView:
      type: object
      additionalProperties: false
      required: [activity_id, activity_type, summary, created_at_unix_ms]
      properties:
        activity_id:
          $ref: "#/components/schemas/ResourceId"
        activity_type:
          type: string
          enum: [created, phase_changed, ready, failed, retry_started]
        summary:
          type: string
          minLength: 1
          maxLength: 1024
        phase:
          $ref: "#/components/schemas/SnapshotPhase"
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    QuerySnapshotDatasetProfileRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, snapshot_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"

    QuerySnapshotDatasetProfileResponse:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/DatasetProfileView"

    SnapshotState:
      type: string
      enum: [creating, ready, abnormal]

    SnapshotPhase:
      type: string
      enum: [planning, materializing, verifying, idle]

    SnapshotView:
      type: object
      description: 独立身份、固定 Commit、单 StorageVolume 和单 Region 的只读交付资源。
      additionalProperties: false
      required:
        - snapshot_id
        - tenant_id
        - project_id
        - artifact_id
        - commit_id
        - storage_volume_id
        - region
        - message
        - tag_names
        - state
        - phase
        - integrity
        - logical_file_count
        - logical_size_bytes
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        commit_id:
          $ref: "#/components/schemas/CommitId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        region:
          $ref: "#/components/schemas/RegionName"
        message:
          type: string
          minLength: 1
          maxLength: 4096
        tag_names:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TagName"
        state:
          $ref: "#/components/schemas/SnapshotState"
        phase:
          $ref: "#/components/schemas/SnapshotPhase"
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        integrity:
          $ref: "#/components/schemas/SnapshotIntegritySummary"
        logical_file_count:
          $ref: "#/components/schemas/CanonicalU64"
        logical_size_bytes:
          $ref: "#/components/schemas/CanonicalU64"
        dataset_profile:
          $ref: "#/components/schemas/DatasetProfileSummary"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    SnapshotIntegritySummary:
      type: object
      additionalProperties: false
      required: [state, files_verified, bytes_verified]
      properties:
        state:
          type: string
          enum: [pending, verified, failed]
        files_verified:
          $ref: "#/components/schemas/CanonicalU64"
        bytes_verified:
          $ref: "#/components/schemas/CanonicalU64"
        verified_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    CreateAddJobRequest:
      type: object
      description: |
        公开 Add operation。服务端将认证后的 PrincipalRef 注入 canonical operation 后计算
        `request_digest` 并写入内部 AddJobSpec；请求中的未知非保留字段按协议兼容规则参与 digest。
      additionalProperties: true
      required:
        - tenant_id
        - project_id
        - artifact_id
        - playground_id
        - job_id
        - expected_index_version
        - deadline_unix_ms
        - paths
        - all
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        playground_id:
          $ref: "#/components/schemas/PlaygroundId"
        job_id:
          $ref: "#/components/schemas/JobId"
        expected_index_version:
          $ref: "#/components/schemas/IndexVersion"
        deadline_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        paths:
          type: array
          maxItems: 4096
          uniqueItems: true
          description: |
            严格排序、无 portable duplicate，且不能同时包含文件路径及其后代。
            `all` 为 false 时至少包含一项。
          items:
            $ref: "#/components/schemas/LogicalPath"
        all:
          type: boolean

    CreateAddJobResponse:
      type: object
      additionalProperties: false
      required: [job, replayed]
      properties:
        job:
          $ref: "#/components/schemas/JobView"
        replayed:
          type: boolean
          description: true 表示返回的是已持久化的同一请求结果。

    QueryJobRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, job_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        job_id:
          $ref: "#/components/schemas/JobId"

    QueryJobResponse:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/JobView"

    FinalizeAddJobRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, job_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        job_id:
          $ref: "#/components/schemas/JobId"

    FinalizeAddJobResponse:
      type: object
      additionalProperties: false
      required:
        - job
        - decision
        - finalized_at_unix_ms
        - replayed
      properties:
        job:
          $ref: "#/components/schemas/JobView"
        decision:
          $ref: "#/components/schemas/PublicJobDecision"
        finalized_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        replayed:
          type: boolean

    JobView:
      type: object
      description: |
        面向用户的脱敏 Job。不得增加 assignment target、Agent/Volume/Mount identity、
        generation/fencing、PublicationCandidate、Manifest、IndexDelta 或 authority 物理信息。
      additionalProperties: true
      propertyNames:
        not:
          enum:
            - accepted
            - agent_id
            - agent_mount_id
            - artifact_placement_id
            - assignment
            - assignment_generation
            - assignment_id
            - assignment_target
            - decision_generation
            - edge_cluster_id
            - fencing
            - fencing_token
            - finalized_ack
            - generation
            - index_delta
            - lease
            - manifest
            - manifests
            - mount_generation
            - mutations
            - owner_generation
            - placement_generation
            - prepared
            - publication_candidate
            - resume_publication
            - storage_volume_id
      required:
        - operation
        - tenant_id
        - project_id
        - artifact_id
        - playground_id
        - job_id
        - state
        - resource_version
        - deadline_unix_ms
      properties:
        operation:
          type: string
          const: add
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        playground_id:
          $ref: "#/components/schemas/PlaygroundId"
        job_id:
          $ref: "#/components/schemas/JobId"
        state:
          $ref: "#/components/schemas/JobState"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        deadline_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        progress:
          $ref: "#/components/schemas/PublicJobProgress"
        decision:
          $ref: "#/components/schemas/PublicJobDecision"
        failure:
          $ref: "#/components/schemas/PublicJobFailure"
        finalized_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    PublicJobProgress:
      type: object
      additionalProperties: true
      required:
        - state
        - phase
        - files_completed
        - bytes_completed
      properties:
        state:
          $ref: "#/components/schemas/JobState"
        phase:
          type: string
          minLength: 1
          maxLength: 128
        files_completed:
          $ref: "#/components/schemas/CanonicalU64"
        bytes_completed:
          $ref: "#/components/schemas/CanonicalU64"
        retry_after_ms:
          $ref: "#/components/schemas/CanonicalU64"

    PublicJobDecision:
      oneOf:
        - $ref: "#/components/schemas/PublishJobDecision"
        - $ref: "#/components/schemas/ConflictJobDecision"
        - $ref: "#/components/schemas/RejectJobDecision"
      discriminator:
        propertyName: outcome
        mapping:
          publish: "#/components/schemas/PublishJobDecision"
          conflict: "#/components/schemas/ConflictJobDecision"
          reject: "#/components/schemas/RejectJobDecision"

    PublishJobDecision:
      type: object
      additionalProperties: true
      required: [outcome, final_state, published_index_version]
      properties:
        outcome:
          type: string
          const: publish
        final_state:
          type: string
          const: succeeded
        published_index_version:
          $ref: "#/components/schemas/IndexVersion"

    ConflictJobDecision:
      type: object
      additionalProperties: true
      required: [outcome, final_state, current_index_version]
      properties:
        outcome:
          type: string
          const: conflict
        final_state:
          type: string
          const: conflicted
        current_index_version:
          $ref: "#/components/schemas/IndexVersion"

    RejectJobDecision:
      type: object
      additionalProperties: true
      required: [outcome, final_state, error]
      properties:
        outcome:
          type: string
          const: reject
        final_state:
          type: string
          enum:
            - rejected
            - failed
            - cancelled
            - timed_out
            - recovery_required
        error:
          $ref: "#/components/schemas/JobError"

    PublicJobFailure:
      type: object
      additionalProperties: true
      required: [final_state, failed_at_unix_ms, stage, error]
      properties:
        final_state:
          type: string
          enum:
            - rejected
            - failed
            - cancelled
            - timed_out
            - recovery_required
        failed_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        stage:
          type: string
          enum:
            - execution
            - object_transfer
            - reporting
            - finalization
        error:
          $ref: "#/components/schemas/JobError"

    JobError:
      type: object
      additionalProperties: true
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 4096
        retryable:
          type: boolean
        retry_after_ms:
          $ref: "#/components/schemas/CanonicalU64"

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details，并携带 NeoEngram 稳定错误字段。
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - request_id
        - retryable
      properties:
        type:
          type: string
          format: uri-reference
          pattern: "^urn:neoengram:problem:[a-z0-9-]+$"
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 4096
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ErrorCode"
        request_id:
          $ref: "#/components/schemas/RequestId"
        retryable:
          type: boolean
        retry_after_ms:
          $ref: "#/components/schemas/CanonicalU64"
        violations:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/FieldViolation"

    FieldViolation:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 256
        reason:
          type: string
          minLength: 1
          maxLength: 1024

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    TenantId:
      $ref: "#/components/schemas/ResourceId"
    StorageVolumeId:
      $ref: "#/components/schemas/ResourceId"
    StorageEnrollmentId:
      $ref: "#/components/schemas/ResourceId"
    StorageEnrollmentTokenId:
      $ref: "#/components/schemas/ResourceId"
    EdgeClusterId:
      $ref: "#/components/schemas/ResourceId"
    ProjectId:
      $ref: "#/components/schemas/ResourceId"
    ArtifactId:
      $ref: "#/components/schemas/ResourceId"
    PlaygroundId:
      $ref: "#/components/schemas/ResourceId"
    CommitId:
      $ref: "#/components/schemas/ResourceId"
    PreCommitId:
      $ref: "#/components/schemas/ResourceId"
    SnapshotId:
      $ref: "#/components/schemas/ResourceId"
    JobId:
      $ref: "#/components/schemas/ResourceId"
    RequestId:
      $ref: "#/components/schemas/ResourceId"

    StorageEnrollmentBootstrapToken:
      type: string
      description: 15 分钟有效且只能成功消费一次的 opaque secret；不得写入日志、审计或其他公开 DTO。
      readOnly: true
      minLength: 32
      maxLength: 2048
      pattern: "^[A-Za-z0-9._~-]+$"

    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,127})$"

    ErrorCode:
      type: string
      minLength: 1
      maxLength: 96
      pattern: "^[A-Z][A-Z0-9_]{0,95}$"

    DisplayName:
      type: string
      minLength: 1
      maxLength: 128

    Description:
      type: string
      maxLength: 2048

    RegionName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"

    StorageBackendType:
      type: string
      enum: [pvc, nfs]

    StorageAccessMode:
      type: string
      enum: [read_write_many, read_write_once, read_only_many]

    KubernetesNamespaceName:
      type: string
      description: Kubernetes DNS-1123 label；Namespace 最长 63 字符且不允许点号。
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$"

    KubernetesPvcClaimName:
      type: string
      description: Kubernetes DNS-1123 subdomain；每个 label 最长 63 字符，完整名称最长 253 字符。
      minLength: 1
      maxLength: 253
      pattern: '^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$'

    StorageVolumeState:
      type: string
      enum: [ready, degraded, unavailable]

    PermissionName:
      type: string
      minLength: 3
      maxLength: 128
      pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$'

    TagName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^(?!refs/)[A-Za-z0-9](?:[A-Za-z0-9._/-]{0,127})$"

    PageCursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: 服务端生成、与资源 scope、筛选条件和排序绑定的不透明分页 token。

    PageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 50

    SearchQuery:
      type: string
      minLength: 1
      maxLength: 256

    ContentDigest:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"

    CanonicalU64:
      type: string
      minLength: 1
      maxLength: 20
      pattern: "^(0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-5])$"

    UnixMillis:
      allOf:
        - $ref: "#/components/schemas/CanonicalU64"
      description: Unix 毫秒时间戳，编码为 canonical decimal JSON string。

    LogicalPath:
      type: string
      minLength: 1
      description: |
        NFC 规范化、使用 `/` 分隔的 repository-relative portable path；不能包含绝对路径、
        空/dot component、反斜杠、NUL、平台保留字符或 NeoEngram 内部名称。

    IndexVersion:
      type: object
      additionalProperties: true
      required: [revision, digest]
      properties:
        revision:
          $ref: "#/components/schemas/CanonicalU64"
        digest:
          $ref: "#/components/schemas/ContentDigest"

    JobState:
      type: string
      enum:
        - queued
        - assigned
        - accepted
        - running
        - prepared
        - publishing
        - cancel_requested
        - succeeded
        - conflicted
        - rejected
        - failed
        - cancelled
        - timed_out
        - recovery_required
        - unknown
