  /api/job/add/finalize:
    post:
      tags: [Job]
      operationId: finalizeAddJob
      summary: 校验并发布 Managed Add
      description: |
        对完整 MetadataBatch、中心 object durability 和 expected IndexVersion 执行最终校验与
        CAS。成功、冲突和拒绝都会形成稳定的 Job decision；重复调用返回同一终态。

        内部 `ResumePublication` 恢复方法不通过此接口暴露。用户调用始终重新执行授权，
        但不会为已持久化的 Publishing candidate 重新构造发布内容。
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeAddJobRequest"
            example:
              tenant_id: tenant-a
              job_id: job-20260727-001
      responses:
        "200":
          description: Add 已形成稳定发布决定
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeAddJobResponse"
              examples:
                published:
                  summary: Index CAS 发布成功
                  value:
                    job:
                      operation: add
                      tenant_id: tenant-a
                      project_id: project-a
                      artifact_id: artifact-a
                      playground_id: playground-a
                      job_id: job-20260727-001
                      state: succeeded
                      resource_version: "7"
                      deadline_unix_ms: "1785168000000"
                      decision:
                        outcome: publish
                        final_state: succeeded
                        published_index_version:
                          revision: "1"
                          digest: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                      finalized_at_unix_ms: "1785167999000"
                    decision:
                      outcome: publish
                      final_state: succeeded
                      published_index_version:
                        revision: "1"
                        digest: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                    finalized_at_unix_ms: "1785167999000"
                    replayed: false
                replayed:
                  summary: 终态重放
                  value:
                    job:
                      operation: add
                      tenant_id: tenant-a
                      project_id: project-a
                      artifact_id: artifact-a
                      playground_id: playground-a
                      job_id: job-20260727-001
                      state: succeeded
                      resource_version: "7"
                      deadline_unix_ms: "1785168000000"
                      decision:
                        outcome: publish
                        final_state: succeeded
                        published_index_version:
                          revision: "1"
                          digest: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                      finalized_at_unix_ms: "1785167999000"
                    decision:
                      outcome: publish
                      final_state: succeeded
                      published_index_version:
                        revision: "1"
                        digest: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                    finalized_at_unix_ms: "1785167999000"
                    replayed: true
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/JobNotFoundProblem"
        "408":
          $ref: "#/components/responses/DeadlineProblem"
        "409":
          $ref: "#/components/responses/FinalizeConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

  /health/live:
    get:
      tags: [Health]
      operationId: liveProbe
      summary: 检查 neoengramd 进程是否存活
      security: []
      description: 不访问 authority；仅表示进程可以处理 HTTP 请求。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 进程存活
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

  /health/ready:
    get:
      tags: [Health]
      operationId: readyProbe
      summary: 检查 neoengramd 是否可以接收业务请求
      security: []
      description: 至少验证 authority 已打开并通过其后端完整性检查。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: 服务已就绪
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/OverloadedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/RequestTimeoutProblem"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        由部署配置的 OIDC issuer 签发。服务端从验证后的 issuer/sub 映射 PrincipalRef，
        tenant scope 只能由启动时加载的服务端 RBAC 策略授予。JWT 中的 tenant、role、group
        只能作为审计提示；token 或请求体中的身份提示都不能覆盖服务端授权结果。

  parameters:
    ApiVersion:
      name: NeoEngram-API-Version
      in: header
      required: true
      description: 公开 API 主版本；不兼容演进不改变 path。
      schema:
        type: string
        enum: ["1"]
      example: "1"
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        可选的调用方请求 ID。缺失时由服务端生成；无论来源如何，响应都必须回传最终 ID。
      schema:
        $ref: "#/components/schemas/RequestId"
      example: req-20260727-001
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context traceparent。
      schema:
        type: string
        minLength: 55
        maxLength: 512
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01

  headers:
    RequestId:
      required: true
      description: 服务端确认或生成的请求 ID。
      schema:
        $ref: "#/components/schemas/RequestId"
      example: req-20260727-001

  responses:
    AuthenticationProblem:
      description: Bearer token 缺失、无效或已过期
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:authentication-required
            title: Authentication required
            status: 401
            detail: A valid Bearer token is required
            instance: /api/job/query
            code: AUTHENTICATION_REQUIRED
            request_id: req-20260727-001
            retryable: false
    AuthorizationProblem:
      description: principal 无权执行当前方法
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:authorization-denied
            title: Authorization denied
            status: 403
            detail: The principal is not authorized for this operation
            instance: /api/job/add/finalize
            code: AUTHORIZATION_DENIED
            request_id: req-20260727-001
            retryable: false
    JobNotFoundProblem:
      description: Job 不存在或对当前 principal 不可见
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:job-not-found
            title: Job not found
            status: 404
            detail: The requested Job was not found
            instance: /api/job/query
            code: JOB_NOT_FOUND
            request_id: req-20260727-001
            retryable: false
    ResourceNotFoundProblem:
      description: 资源不存在，或对当前 principal 不可见
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            tenantNotFound:
              value:
                type: urn:neoengram:problem:tenant-not-found
                title: Tenant not found
                status: 404
                detail: The requested Tenant was not found
                instance: /api/tenant/query
                code: TENANT_NOT_FOUND
                request_id: req-20260727-001
                retryable: false
            artifactNotFound:
              value:
                type: urn:neoengram:problem:artifact-not-found
                title: Artifact not found
                status: 404
                detail: The requested Artifact was not found
                instance: /api/artifact/query
                code: ARTIFACT_NOT_FOUND
                request_id: req-20260727-001
                retryable: false
    StorageEnrollmentNotFoundProblem:
      description: Storage enrollment 不存在，或不属于当前认证 principal 可见的 Tenant
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:storage-enrollment-not-found
            title: Storage enrollment not found
            status: 404
            detail: The requested Storage enrollment was not found
            instance: /api/storage/enrollment/query
            code: STORAGE_ENROLLMENT_NOT_FOUND
            request_id: req-20260731-001
            retryable: false
    TenantConflictProblem:
      description: Tenant ID 已绑定另一份创建内容
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:tenant-id-reused
            title: Tenant ID reused
            status: 409
            detail: The Tenant ID already belongs to a different create request
            instance: /api/tenant/create
            code: TENANT_ID_REUSED
            request_id: req-20260727-001
            retryable: false
    MutationConflictProblem:
      description: 资源 identity 已绑定另一创建内容，或 expected version 不再匹配
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:resource-conflict
            title: Resource mutation conflict
            status: 409
            detail: The resource identity or expected version conflicts with current state
            instance: /api/playground/commit/create
            code: RESOURCE_CONFLICT
            request_id: req-20260727-001
            retryable: false
    StorageEnrollmentConflictProblem:
      description: enrollment identity、状态、绑定或 expected resource version 与当前权威状态冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            staleResourceVersion:
              value:
                type: urn:neoengram:problem:storage-enrollment-version-conflict
                title: Storage enrollment version conflict
                status: 409
                detail: The Storage enrollment resource version changed before review
                instance: /api/storage/enrollment/approve
                code: STORAGE_ENROLLMENT_VERSION_CONFLICT
                request_id: req-20260731-001
                retryable: false
            tokenRequestIdentityReused:
              value:
                type: urn:neoengram:problem:storage-enrollment-token-request-id-reused
                title: Storage enrollment token request ID reused
                status: 409
                detail: The token request ID already belongs to a different payload
                instance: /api/storage/enrollment/token/create
                code: STORAGE_ENROLLMENT_TOKEN_REQUEST_ID_REUSED
                request_id: req-20260731-002
                retryable: false
            decisionRequestIdentityReused:
              value:
                type: urn:neoengram:problem:storage-enrollment-decision-id-reused
                title: Storage enrollment decision request ID reused
                status: 409
                detail: The decision request ID already belongs to another review action or payload
                instance: /api/storage/enrollment/reject
                code: STORAGE_ENROLLMENT_DECISION_ID_REUSED
                request_id: req-20260731-003
                retryable: false
            pvcAlreadyEnrolled:
              value:
                type: urn:neoengram:problem:pvc-already-enrolled
                title: PVC already enrolled
                status: 409
                detail: The PVC is already bound to another active Agent enrollment
                instance: /api/storage/enrollment/approve
                code: PVC_ALREADY_ENROLLED
                request_id: req-20260731-003
                retryable: false
            replacementConfirmationRequired:
              value:
                type: urn:neoengram:problem:storage-enrollment-replacement-confirmation-required
                title: Replacement confirmation required
                status: 409
                detail: Replacement enrollment approval requires explicit confirmation
                instance: /api/storage/enrollment/approve
                code: STORAGE_ENROLLMENT_REPLACEMENT_CONFIRMATION_REQUIRED
                request_id: req-20260731-004
                retryable: false
            descriptorMismatch:
              value:
                type: urn:neoengram:problem:storage-volume-descriptor-mismatch
                title: StorageVolume descriptor mismatch
                status: 409
                detail: The enrollment probe does not match the descriptor frozen by the bootstrap token
                instance: /api/storage/enrollment/approve
                code: STORAGE_VOLUME_DESCRIPTOR_MISMATCH
                request_id: req-20260731-005
                retryable: false
    CursorConflictProblem:
      description: Cursor 无效、已过期或与当前 scope/filter 不匹配
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:cursor-invalid
            title: Cursor is invalid
            status: 409
            detail: The cursor is invalid or does not match the current query
            instance: /api/artifact/commit/graph/query
            code: CURSOR_INVALID
            request_id: req-20260727-001
            retryable: false
    DeadlineProblem:
      description: Job deadline 已过期
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:job-deadline-exceeded
            title: Job deadline exceeded
            status: 408
            detail: The managed Add deadline has elapsed
            instance: /api/job/add/finalize
            code: JOB_DEADLINE_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    CreateConflictProblem:
      description: Job ID 已绑定另一请求，或 Job 创建发生并发冲突
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            reusedJobId:
              summary: 相同 Job ID 携带另一 request digest
              value:
                type: urn:neoengram:problem:job-id-reused
                title: Job ID reused
                status: 409
                detail: The Job ID already belongs to a different managed Add request
                instance: /api/job/add/create
                code: JOB_ID_REUSED
                request_id: req-20260727-001
                retryable: false
            concurrentUpdate:
              summary: authority CAS 发生并发更新
              value:
                type: urn:neoengram:problem:concurrent-update
                title: Concurrent update
                status: 409
                detail: The Job resource version changed during the request
                instance: /api/job/add/create
                code: CONCURRENT_UPDATE
                request_id: req-20260727-001
                retryable: true
                retry_after_ms: "100"
    FinalizeConflictProblem:
      description: Job 状态、MetadataBatch、durability 或 CAS 前置条件尚不满足
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            invalidState:
              summary: Job 尚未进入 Prepared
              value:
                type: urn:neoengram:problem:job-invalid-state
                title: Job state does not allow finalization
                status: 409
                detail: Managed Add can only be finalized from Prepared or a stable terminal state
                instance: /api/job/add/finalize
                code: JOB_INVALID_STATE
                request_id: req-20260727-001
                retryable: false
            objectNotDurable:
              summary: 引用对象尚未被中心确认为 Durable
              value:
                type: urn:neoengram:problem:object-not-durable
                title: Object is not durable
                status: 409
                detail: A referenced object has no durable central receipt
                instance: /api/job/add/finalize
                code: OBJECT_NOT_DURABLE
                request_id: req-20260727-001
                retryable: true
                retry_after_ms: "1000"
    PayloadTooLargeProblem:
      description: 请求编码字节数超过当前方法上限
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:payload-too-large
            title: Payload too large
            status: 413
            detail: The encoded request exceeds the method limit
            instance: /api/job/add/create
            code: PROTOCOL_LIMIT_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    ValidationProblem:
      description: 请求 header、protocol 或 metadata 违反公开契约
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unsupportedApiVersion:
              summary: API 主版本不受支持
              value:
                type: urn:neoengram:problem:api-version-unsupported
                title: API version is unsupported
                status: 422
                detail: NeoEngram-API-Version must be 1
                instance: /api/job/query
                code: API_VERSION_UNSUPPORTED
                request_id: req-20260727-001
                retryable: false
                violations:
                  - field: NeoEngram-API-Version
                    reason: unsupported value
            invalidPathSelection:
              summary: Add path 集合无效
              value:
                type: urn:neoengram:problem:protocol-invalid
                title: Request validation failed
                status: 422
                detail: paths must be non-empty unless all is true
                instance: /api/job/add/create
                code: PROTOCOL_INVALID
                request_id: req-20260727-001
                retryable: false
                violations:
                  - field: paths
                    reason: must be non-empty unless all is true
    OverloadedProblem:
      description: 服务端并发请求配额已耗尽
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:overloaded
            title: Resource exhausted
            status: 429
            detail: server request concurrency is exhausted
            instance: /api/job/query
            code: OVERLOADED
            request_id: req-20260727-001
            retryable: false
    RequestTimeoutProblem:
      description: 请求超过服务端处理时限
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:deadline-exceeded
            title: Request deadline exceeded
            status: 504
            detail: service invocation deadline elapsed
            instance: /api/job/query
            code: DEADLINE_EXCEEDED
            request_id: req-20260727-001
            retryable: false
    InternalProblem:
      description: 未分类的服务端内部错误
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:internal
            title: Internal error
            status: 500
            detail: The server could not complete the request
            instance: /api/job/query
            code: INTERNAL
            request_id: req-20260727-001
            retryable: true
    ServiceUnavailableProblem:
      description: authority 或必要依赖暂不可用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: urn:neoengram:problem:storage-failure
            title: Authority unavailable
            status: 503
            detail: The authority store is temporarily unavailable
            instance: /health/ready
            code: STORAGE_FAILURE
            request_id: req-20260727-001
            retryable: true
            retry_after_ms: "1000"

  schemas:
    EmptyRequest:
      type: object
      additionalProperties: false

    ApiVersionResponse:
      type: object
      additionalProperties: false
      required:
        - api_versions
        - agent_protocol_versions
        - capabilities
      properties:
        api_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [1]
        agent_protocol_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [1]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[a-z][a-z0-9_]{0,127}$"

    QueryTenantListRequest:
      type: object
      additionalProperties: false
      properties:
        cursor:
          $ref: "#/components/schemas/PageCursor"
        page_size:
          $ref: "#/components/schemas/PageSize"
        query:
          $ref: "#/components/schemas/SearchQuery"

    QueryTenantListResponse:
      type: object
      additionalProperties: false
      required: [items, can_create_tenant]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TenantView"
        next_cursor:
          $ref: "#/components/schemas/PageCursor"
        can_create_tenant:
          type: boolean

    QueryTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"

    QueryTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantView"

    CreateTenantRequest:
      type: object
      additionalProperties: true
      propertyNames:
        not:
          enum: [actor, principal]
      required: [tenant_id, display_name]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        description:
          $ref: "#/components/schemas/Description"

    CreateTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant, replayed]
      properties:
        tenant:
          $ref: "#/components/schemas/TenantView"
        replayed:
          type: boolean

    TenantView:
      type: object
      description: 当前 principal 可见的脱敏租户视图，不包含认证策略或存储配置。
      additionalProperties: false
      required:
