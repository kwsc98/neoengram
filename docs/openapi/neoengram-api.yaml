          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        workspace_id:
          $ref: "#/components/schemas/WorkspaceId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        base_commit_id:
          $ref: "#/components/schemas/CommitId"
          description: |
            可选的 canonical Commit 内容摘要。显式值必须属于请求 scope 指定的 Artifact，可以是
            当前 Head 或历史 Commit；省略时服务端冻结创建瞬间的当前 Head。空 Artifact 必须省略，
            且服务端不会为其伪造 base Commit。

    CreateWorkspaceResponse:
      type: object
      additionalProperties: false
      required: [workspace, request_replayed, execution_reused]
      properties:
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    WorkspaceState:
      type: string
      enum: [creating, ready, abnormal]

    WorkspaceStorageAvailability:
      type: string
      description: |
        Workspace 所在 StorageVolume 的实时可达性。`unknown` 表示服务端当前无法确认存储状态；
        只有 `ready` 可以执行扫描、Pre-commit 检测等依赖 Agent 的实时操作。中心已持久化的
        Index、文件清单、变化和 Profile 不受该字段限制。
      enum: [ready, degraded, unavailable, unknown]

    WorkspaceView:
      type: object
      description: |
        Workspace 的 `tenant_id + project_id + artifact_id` 是不可变来源 scope，Region 始终由所选
        StorageVolume 派生。`state` 只表达持久生命周期，`storage_availability` 表达所在存储的
        实时可达性；scanning、hashing、uploading 和 validating 仅属于独立 Pre-commit 流程。
      additionalProperties: false
      required:
        - tenant_id
        - project_id
        - artifact_id
        - workspace_id
        - storage_volume_id
        - region
        - display_name
        - index_version
        - state
        - storage_availability
        - resource_version
        - lifecycle
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        workspace_id:
          $ref: "#/components/schemas/WorkspaceId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        region:
          $ref: "#/components/schemas/RegionName"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        base_commit_id:
          $ref: "#/components/schemas/CommitId"
        head_commit_id:
          $ref: "#/components/schemas/CommitId"
        index_version:
          $ref: "#/components/schemas/IndexVersion"
        state:
          $ref: "#/components/schemas/WorkspaceState"
        storage_availability:
          $ref: "#/components/schemas/WorkspaceStorageAvailability"
        active_precommit_id:
          $ref: "#/components/schemas/PreCommitId"
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        lifecycle:
          $ref: "#/components/schemas/ResourceLifecycleView"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    StartPreCommitRequest:
      type: object
      description: |
        创建新 Pre-commit 会话的请求。服务端内部冻结当前 Head；客户端不提交
        `source_head_commit_id`，也不能通过读取页面隐式发送本请求。
      additionalProperties: false
      required:
        - tenant_id
        - project_id
        - artifact_id
        - workspace_id
        - precommit_request_id
        - expected_index_version
        - data_layout
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        workspace_id:
          $ref: "#/components/schemas/WorkspaceId"
        precommit_request_id:
          $ref: "#/components/schemas/ResourceId"
        expected_index_version:
          $ref: "#/components/schemas/IndexVersion"
        data_layout:
          $ref: "#/components/schemas/DataLayout"

    StartPreCommitResponse:
      type: object
      additionalProperties: false
      required: [precommit, workspace, request_replayed, execution_reused]
      properties:
        precommit:
          $ref: "#/components/schemas/PreCommitView"
        workspace:
          $ref: "#/components/schemas/WorkspaceView"
        request_replayed:
          type: boolean
        execution_reused:
          type: boolean
        task:
          $ref: "#/components/schemas/TaskView"

    QueryPreCommitRequest:
      type: object
      additionalProperties: false
