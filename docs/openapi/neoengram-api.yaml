        - storage_volume_id
        - snapshot_request_id
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        commit_id:
          $ref: "#/components/schemas/CommitId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        snapshot_request_id:
