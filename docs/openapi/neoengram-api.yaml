      enum: [creating, ready, abnormal]

    SnapshotView:
      type: object
      description: |
        独立身份，固定一个 Artifact、Commit 和目标物理交付的不可变 Snapshot 资源。
        `tenant_id + project_id + artifact_id + commit_id + delivery_id + storage_volume_id` 是不可变
        来源 scope；Snapshot 与唯一 SnapshotDelivery 一起创建，交付未完成时 Snapshot 不会进入
        `ready`。
        Snapshot 的不可变来源 scope 由 Artifact authority 派生；Snapshot 不拥有或改写 Artifact 数据权威。
      additionalProperties: false
      required:
        - snapshot_id
        - tenant_id
        - project_id
        - artifact_id
        - commit_id
        - delivery_id
        - edge_cluster_id
        - storage_volume_id
        - delivery_mode
        - data_layout
        - message
        - tag_names
        - state
        - data_health
        - integrity
        - resource_version
        - lifecycle
        - logical_file_count
        - logical_size_bytes
        - created_at_unix_ms
        - updated_at_unix_ms
      properties:
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        commit_id:
          $ref: "#/components/schemas/CommitId"
        delivery_id:
          $ref: "#/components/schemas/SnapshotDeliveryId"
        edge_cluster_id:
          $ref: "#/components/schemas/EdgeClusterId"
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"
        delivery_mode:
          $ref: "#/components/schemas/SnapshotDeliveryMode"
        data_layout:
          $ref: "#/components/schemas/DataLayout"
        message:
          type: string
          minLength: 1
          maxLength: 4096
        tag_names:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TagName"
        state:
          $ref: "#/components/schemas/SnapshotState"
        data_health:
          type: string
          description: Commit object availability resolved from object-level Verified Placements and derived Volume Coverage.
          enum: [available, degraded, unavailable]
        issue:
          $ref: "#/components/schemas/ResourceIssueSummary"
        integrity:
          $ref: "#/components/schemas/SnapshotIntegritySummary"
        resource_version:
          $ref: "#/components/schemas/CanonicalU64"
        lifecycle:
          $ref: "#/components/schemas/ResourceLifecycleView"
        logical_file_count:
          $ref: "#/components/schemas/CanonicalU64"
        logical_size_bytes:
          $ref: "#/components/schemas/CanonicalU64"
        dataset_profile:
          $ref: "#/components/schemas/DatasetProfileSummary"
        created_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        updated_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    SnapshotIntegritySummary:
      type: object
      additionalProperties: false
      required: [state, files_verified, bytes_verified]
      properties:
        state:
          type: string
          enum: [pending, verified, failed]
        files_verified:
          $ref: "#/components/schemas/CanonicalU64"
        bytes_verified:
          $ref: "#/components/schemas/CanonicalU64"
        verified_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    ResourceLifecycleState:
      type: string
      description: 与资源健康状态独立的访问和删除生命周期。
      enum: [active, pending_delete, deleting, restoring, deleted]

    ResourceLifecycleView:
      type: object
      description: |
        四类可删除存储资源共享的生命周期 fence。`generation` 在删除、恢复和最终清理时单调增加，
        Agent assignment、S3 Ticket 和迟到报告必须携带并匹配该值。
      additionalProperties: false
      required: [state, generation]
      properties:
        state:
          $ref: "#/components/schemas/ResourceLifecycleState"
        generation:
          $ref: "#/components/schemas/PositiveCanonicalU64"
        active_deletion_id:
          $ref: "#/components/schemas/DeletionId"
        delete_requested_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        purge_after_unix_ms:
          $ref: "#/components/schemas/UnixMillis"
        deleted_at_unix_ms:
          $ref: "#/components/schemas/UnixMillis"

    ResourceRef:
      description: Tenant scope 由包含该引用的请求携带，不允许从资源 ID 推断或覆盖。
      oneOf:
        - $ref: "#/components/schemas/ProjectResourceRef"
        - $ref: "#/components/schemas/StorageVolumeResourceRef"
        - $ref: "#/components/schemas/ArtifactResourceRef"
        - $ref: "#/components/schemas/WorkspaceResourceRef"
        - $ref: "#/components/schemas/SnapshotResourceRef"
      discriminator:
        propertyName: type
        mapping:
          project: "#/components/schemas/ProjectResourceRef"
          storage_volume: "#/components/schemas/StorageVolumeResourceRef"
          artifact: "#/components/schemas/ArtifactResourceRef"
          workspace: "#/components/schemas/WorkspaceResourceRef"
          snapshot: "#/components/schemas/SnapshotResourceRef"

    ProjectResourceRef:
      type: object
      additionalProperties: false
      required: [type, project_id]
      properties:
        type:
          type: string
          const: project
        project_id:
          $ref: "#/components/schemas/ProjectId"

    StorageVolumeResourceRef:
      type: object
      additionalProperties: false
      required: [type, storage_volume_id]
      properties:
        type:
          type: string
          const: storage_volume
        storage_volume_id:
          $ref: "#/components/schemas/StorageVolumeId"

    ArtifactResourceRef:
      type: object
      additionalProperties: false
      required: [type, project_id, artifact_id]
      properties:
        type:
          type: string
          const: artifact
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"

    WorkspaceResourceRef:
      type: object
      additionalProperties: false
      required: [type, project_id, artifact_id, workspace_id]
      properties:
        type:
          type: string
          const: workspace
        project_id:
          $ref: "#/components/schemas/ProjectId"
        artifact_id:
          $ref: "#/components/schemas/ArtifactId"
        workspace_id:
          $ref: "#/components/schemas/WorkspaceId"

    SnapshotResourceRef:
      type: object
      additionalProperties: false
      required: [type, snapshot_id]
      properties:
        type:
          type: string
          const: snapshot
        snapshot_id:
          $ref: "#/components/schemas/SnapshotId"

