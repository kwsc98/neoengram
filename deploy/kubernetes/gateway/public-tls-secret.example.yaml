# Example-only browser/S3 server identity shared by the Pool's public hostname listener. This is
# deliberately separate from each Replica's workload mTLS identity and bootstrap credentials.
# The rendered certificate SANs must cover console.example.test, s3.example.test, and
# *.s3.example.test so virtual-hosted-style bucket requests complete TLS before Host routing.
apiVersion: v1
kind: Secret
metadata:
  name: neoengram-gateway-public-tls-gateway-pool-example
  namespace: neoengram-gateway-example
  annotations:
    neoengram.io/example-only: "external-provisioner-required"
  labels:
    app.kubernetes.io/name: neoengram-gateway
    app.kubernetes.io/component: edge-gateway-public
    neoengram.io/edge-cluster: edge-example
    neoengram.io/gateway-pool: gateway-pool-example
immutable: true
type: kubernetes.io/tls
stringData:
  tls.crt: |
    REPLACE_WITH_PUBLIC_CONSOLE_AND_WILDCARD_S3_CERTIFICATE_PEM
  tls.key: |
    REPLACE_WITH_PUBLIC_TLS_PRIVATE_KEY_PEM
