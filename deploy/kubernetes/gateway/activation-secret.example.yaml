# One-time Central activation credentials. These Secrets are intentionally separate from the
# listener identity and are never shared across replicas. Central stores only the token digest;
# the external provisioner must deliver the plaintext token exactly once and then remove/revoke it.
apiVersion: v1
kind: Secret
metadata:
  name: neoengram-gateway-activation-gateway-pool-example-r0
  namespace: neoengram-gateway-example
  annotations:
    neoengram.io/example-only: "external-provisioner-required"
    neoengram.io/gateway-replica-id: gateway-pool-example-r0
  labels:
    app.kubernetes.io/name: neoengram-gateway
    app.kubernetes.io/component: edge-gateway
    neoengram.io/edge-cluster: edge-example
    neoengram.io/gateway-pool: gateway-pool-example
    neoengram.io/gateway-replica: gateway-pool-example-r0
immutable: true
type: Opaque
stringData:
  activation-token: |
    REPLACE_WITH_CENTRAL_ONE_TIME_ACTIVATION_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: neoengram-gateway-activation-gateway-pool-example-r1
  namespace: neoengram-gateway-example
  annotations:
    neoengram.io/example-only: "external-provisioner-required"
    neoengram.io/gateway-replica-id: gateway-pool-example-r1
  labels:
    app.kubernetes.io/name: neoengram-gateway
    app.kubernetes.io/component: edge-gateway
    neoengram.io/edge-cluster: edge-example
    neoengram.io/gateway-pool: gateway-pool-example
    neoengram.io/gateway-replica: gateway-pool-example-r1
immutable: true
type: Opaque
stringData:
  activation-token: |
    REPLACE_WITH_CENTRAL_ONE_TIME_ACTIVATION_TOKEN
