# Example-only bootstrap server identities. There is one Secret per explicitly managed
# GatewayReplica; never replace these with a Pool-wide credential Secret. Values are placeholders
# and must be rendered by the external certificate/provisioning workflow.
apiVersion: v1
kind: Secret
metadata:
  name: neoengram-gateway-identity-gateway-pool-example-r0
  namespace: neoengram-gateway-example
  annotations:
    neoengram.io/example-only: "external-provisioner-required"
    neoengram.io/gateway-replica-id: gateway-pool-example-r0
  labels:
    app.kubernetes.io/name: neoengram-gateway
    app.kubernetes.io/component: edge-gateway
    neoengram.io/edge-cluster: edge-example
    neoengram.io/gateway-pool: gateway-pool-example
    neoengram.io/gateway-replica: gateway-pool-example-r0
immutable: true
type: kubernetes.io/tls
stringData:
  # Bootstrap server certificate SANs must include the r0 Service DNS names. The
  # external issuer must not put a CA private key in this Secret.
  tls.crt: |
    REPLACE_WITH_R0_BOOTSTRAP_SERVER_CERTIFICATE_PEM
  tls.key: |
    REPLACE_WITH_R0_BOOTSTRAP_ED25519_PRIVATE_KEY_PEM
  ca.crt: |
    REPLACE_WITH_WORKLOAD_CA_BUNDLE_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: neoengram-gateway-identity-gateway-pool-example-r1
  namespace: neoengram-gateway-example
  annotations:
    neoengram.io/example-only: "external-provisioner-required"
    neoengram.io/gateway-replica-id: gateway-pool-example-r1
  labels:
    app.kubernetes.io/name: neoengram-gateway
    app.kubernetes.io/component: edge-gateway
    neoengram.io/edge-cluster: edge-example
    neoengram.io/gateway-pool: gateway-pool-example
    neoengram.io/gateway-replica: gateway-pool-example-r1
immutable: true
type: kubernetes.io/tls
stringData:
  tls.crt: |
    REPLACE_WITH_R1_BOOTSTRAP_SERVER_CERTIFICATE_PEM
  tls.key: |
    REPLACE_WITH_R1_BOOTSTRAP_ED25519_PRIVATE_KEY_PEM
  ca.crt: |
    REPLACE_WITH_WORKLOAD_CA_BUNDLE_PEM
