apiVersion: v1
kind: Secret
metadata:
  name: neoengram-agent-bootstrap-volume-safe-slug
  namespace: neoengram-agent-example
  annotations:
    neoengram.io/storage-volume-id: volume-example
    neoengram.io/example-only: "replace the token before applying"
  labels:
    app.kubernetes.io/name: neoengram-agent
    app.kubernetes.io/component: storage-agent
    app.kubernetes.io/instance: volume-safe-slug
    neoengram.io/volume-slug: volume-safe-slug
type: Opaque
immutable: true
stringData:
  bootstrap-token: replace-with-a-short-lived-one-time-token
