apiVersion: v1
kind: ConfigMap
metadata:
  name: neoengram-agent-config-volume-safe-slug
  namespace: neoengram-agent-example
  annotations:
    neoengram.io/storage-volume-id: volume-example
  labels:
    app.kubernetes.io/name: neoengram-agent
    app.kubernetes.io/component: storage-agent
    app.kubernetes.io/instance: volume-safe-slug
    neoengram.io/volume-slug: volume-safe-slug
immutable: true
data:
  agent.yaml: |
    schema_version: 1
    wire_version: 1
    gateway_endpoint: https://synapse-gateway.synapse-gateway-example.svc.cluster.local:8443
    trust_bundle_file: /etc/neoengram/gateway-ca.pem
    gateway_workload_trust_domain: mesh.example.test
    central_command_trust_bundle_file: /etc/neoengram/central-command-trust.json
    tenant_id: tenant-example
    edge_cluster_id: edge-example
    storage_volume_id: volume-example
    volume_descriptor_digest: replace-with-64-lowercase-hex-descriptor-digest
    region: cn-example-1
    storage:
      backend_type: pvc
      access_mode: read_write_many
      mount_path: /volume
      state_dir: /var/lib/neoengram-agent
      marker_file: /volume/.neoengram-volume-marker
      expected_volume_marker: volume-example
      pvc_reference:
        namespace: neoengram-agent-example
        claim_name: replace-with-existing-business-pvc
    registration:
      approval_required: true
      token_id: replace-with-storage-enrollment-token-id
      bootstrap_token_file: /var/run/secrets/neoengram/bootstrap-token
    session:
      heartbeat_interval_seconds: 10
      reconnect_max_delay_seconds: 30
    logging:
      format: json
      level: info
  # Replace this fail-closed marker with the PEM trust bundle for this EdgeCluster's GatewayPool.
  gateway-ca.pem: |
    REPLACE_WITH_GATEWAY_POOL_CA_PEM
  # Replace the public SPKI and lifecycle data with Central's published command key bundle.
  central-command-trust.json: |
    {
      "schema_version": 1,
      "keys": [
        {
          "key_id": "replace-with-central-command-key-id",
          "certificate_generation": "1",
          "public_key_spki": "REPLACE_WITH_BASE64URL_NO_PAD_RFC8410_ED25519_SPKI",
          "state": "active"
        }
      ]
    }
