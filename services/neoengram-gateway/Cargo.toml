[package]
name = "neoengram-gateway"
description = "Fail-closed edge Gateway process for NeoEngram control-plane routing"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "neoengram-gateway"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
bytes = "1.12"
base64 = "0.22"
clap = { workspace = true, features = ["derive", "env"] }
getrandom = "0.4"
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2"] }
neoengram-domain.workspace = true
quinn.workspace = true
ring = "0.17.14"
rustls = "0.23"
rustls-pki-types = "1.15"
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
url = "2.5"
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.14.9"
tempfile.workspace = true

[lints]
workspace = true
