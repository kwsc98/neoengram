[package]
name = "neoengramd"
description = "Central control-plane state machines for NeoEngram"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["authority-sqlite"]
authority-sqlite = ["dep:fs2", "dep:sqlx"]

[dependencies]
async-trait.workspace = true
fs2 = { workspace = true, optional = true }
neoengram-core.workspace = true
neoengram-protocol = { path = "../../crates/neoengram-protocol" }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }

[dev-dependencies]
ring = "0.17.14"
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
