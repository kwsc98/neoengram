[package]
name = "neoengram-central"
description = "Canonical NeoEngram Central authority, API, Gateway, S3, and lifecycle service"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "neoengram-central"
path = "src/main.rs"

[features]
default = ["authority-sqlite"]
authority-sqlite = ["dep:fs2", "dep:sqlx"]

[dependencies]
async-trait.workspace = true
base64 = "0.22"
blake3.workspace = true
bytes = "1.12"
clap = { workspace = true, features = ["derive", "env"] }
fs2 = { workspace = true, optional = true }
fusen-rs = "=0.9.0"
getrandom = "0.4"
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto"] }
libc.workspace = true
neoengram-domain.workspace = true
neoengram-runtime.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
rcgen = { version = "0.13.2", features = ["x509-parser"] }
ring = "0.17.14"
rustls = "0.23"
rustls-pki-types = "1.15"
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3.2"
sqlx = { workspace = true, optional = true }
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
x509-parser = "0.16"
zeroize = "1.8"

[dev-dependencies]
hyper = { version = "1.11", features = ["client", "http2", "server"] }
tempfile.workspace = true

[lints]
workspace = true
