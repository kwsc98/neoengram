[package]
name = "neoengram-agent"
description = "NeoEngram Agent state machine, storage execution, and enrollment transport"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "neoengram-agent"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
bytes = "1.12"
blake3.workspace = true
clap.workspace = true
fs2.workspace = true
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
neoengram-domain.workspace = true
neoengram-runtime.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
ring = "0.17.14"
rusqlite.workspace = true
rustix.workspace = true
rustls = "0.23"
rustls-pki-types = "1.15"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
tempfile.workspace = true
thiserror = "2.0"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
x509-parser = "0.16"
uuid = { version = "1.24", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true, features = ["abi-7-31"] }
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["libfuse", "abi-7-19"] }
libc.workspace = true

[dev-dependencies]
futures.workspace = true
hyper = { version = "1.11", features = ["server"] }
neoengram-central = { path = "../../services/neoengram-central" }
rcgen = { version = "0.13.2", features = ["x509-parser"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
