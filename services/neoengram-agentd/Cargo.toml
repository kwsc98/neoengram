[package]
name = "neoengram-agentd"
description = "Standalone NeoEngram storage Agent daemon and enrollment transport"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "neoengram-agent"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
bytes = "1.12"
blake3.workspace = true
clap.workspace = true
fs2.workspace = true
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
neoengram-agent = { path = "../../crates/neoengram-agent" }
neoengram-core.workspace = true
neoengram-engine.workspace = true
neoengram-fs.workspace = true
neoengram-protocol = { path = "../../crates/neoengram-protocol" }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
tempfile.workspace = true
thiserror = "2.0"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true, features = ["abi-7-31"] }
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["libfuse", "abi-7-19"] }
libc.workspace = true

[dev-dependencies]
hyper = { version = "1.11", features = ["server"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
