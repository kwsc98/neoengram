[package]
name = "neoengram-agentd"
description = "Standalone NeoEngram storage Agent daemon and enrollment transport"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "neoengram-agent"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
bytes = "1.12"
clap.workspace = true
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
fs2.workspace = true
neoengram-agent = { path = "../../crates/neoengram-agent" }
neoengram-protocol = { path = "../../crates/neoengram-protocol" }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
thiserror = "2.0"
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
