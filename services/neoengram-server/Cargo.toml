[package]
name = "neoengram-server"
description = "Authenticated HTTP adapter for the NeoEngram control plane"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
blake3.workspace = true
bytes = "1.12"
clap = { workspace = true, features = ["derive", "env"] }
fusen-rs = "=0.9.0"
getrandom = "0.4"
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
jsonwebtoken = { version = "=10.2.0", default-features = false, features = ["rust_crypto"] }
libc.workspace = true
neoengram-core.workspace = true
neoengram-protocol = { path = "../../crates/neoengram-protocol" }
neoengramd = { path = "../neoengramd" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3.2"
thiserror = "2.0"
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
ed25519-dalek = "2.2"
neoengram-agentd = { path = "../neoengram-agentd" }
tempfile.workspace = true

[lints]
workspace = true
