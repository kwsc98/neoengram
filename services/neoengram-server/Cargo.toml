[package]
name = "neoengram-server"
description = "HTTP server binary for the NeoEngram central control plane"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
fusen-rs = "=0.9.0"
neoengram-core.workspace = true
neoengram-protocol = { path = "../../crates/neoengram-protocol" }
neoengramd = { path = "../neoengramd" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
