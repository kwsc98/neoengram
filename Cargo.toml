[workspace]
members = ["neoengram-core", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
fastcdc = "3.2"
fs2 = "0.4"
futures = "0.3"
libc = "0.2"
memmap2 = "0.9"
reflink-copy = "0.1.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neoengram-core = { path = "neoengram-core", version = "0.1.0" }
tempfile = "3.20"
tokio = { version = "1.45", features = ["fs", "macros", "rt-multi-thread"] }
unicode-normalization = "0.1"
walkdir = "2.5"

[workspace.lints.rust]
# memmap2 的映射调用天然需要一个经过审计的 unsafe 边界。默认仍拒绝 unsafe，
# 只有 chunker 中封装 Mmap 的单个函数会局部放行。
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
