[workspace]
members = ["crates/*", "services/*", "apps/neoengram-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.97.1"
authors = ["王思诚 <kwsc98@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kwsc98/neoengram"
homepage = "https://github.com/kwsc98/neoengram"
documentation = "https://docs.rs/neoengram"
readme = "README.md"
keywords = ["version-control", "datasets", "machine-learning", "content-addressed"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
fastcdc = "3.2"
fs2 = "0.4"
futures = "0.3"
fuser = { version = "0.16", default-features = false }
libc = "0.2"
memmap2 = "0.9"
neoengram-domain = { path = "crates/neoengram-domain", version = "0.2.0" }
neoengram-runtime = { path = "crates/neoengram-runtime", version = "0.2.0" }
quinn = { version = "0.11.11", default-features = false, features = ["rustls", "runtime-tokio"] }
reflink-copy = "0.1.30"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "json", "migrate"] }
tempfile = "3.20"
tokio = { version = "1.45", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "0.1"
walkdir = "2.5"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace.lints.rust]
# memmap2 的映射调用天然需要一个经过审计的 unsafe 边界。默认仍拒绝 unsafe，
# 只有 chunker 中封装 Mmap 的单个函数会局部放行。
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
fuser = { path = "vendor/fuser" }
fusen-rs = { path = "vendor/fusen-rs" }
