name: Project full flow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: project-full-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-flow:
    name: Isolated project file flow
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Run isolated full flow
        run: scripts/project-test.sh --no-install full-flow
      - name: Upload project test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-test-${{ github.run_id }}
          path: target/project-test
          if-no-files-found: ignore
