name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - name: Install Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            docs/openapi/package-lock.json
            apps/neoengram-web/package-lock.json
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check architecture boundaries
        run: bash .github/check-architecture.sh
      - name: Check public OpenAPI
        run: |
          npm ci --prefix docs/openapi --ignore-scripts
          npm run lint --prefix docs/openapi
          npm run bundle --prefix docs/openapi
          npm run test:contract --prefix docs/openapi
      - name: Install Web dependencies
        run: npm ci
        working-directory: apps/neoengram-web
      - name: Check Vue Web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run api:check
          npm test
          npm run build
        working-directory: apps/neoengram-web
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Package and verify neoengram-core
        run: cargo package --locked -p neoengram-core
      - name: Assemble neoengram CLI archive only
        run: |
          # The CLI composes publish=false workspace crates. This checks archive
          # assembly/content only; it intentionally does not claim that crates.io
          # can resolve those private dependencies or install the CLI.
          cargo package --locked --no-verify --exclude-lockfile -p neoengram
      - name: Verify package documentation and licenses
        shell: bash
        run: |
          set -euo pipefail

          check_package() {
            local crate="$1"
            local version
            version="$(cargo pkgid -p "$crate" | sed 's/.*#//')"
            local archive="target/package/${crate}-${version}.crate"
            if [[ ! -f "$archive" ]]; then
              echo "missing archive $archive" >&2
              return 1
            fi

            local prefix
            prefix="$(basename "${archive%.crate}")"

            for required in README.md LICENSE-MIT LICENSE-APACHE; do
              if ! tar -tzf "$archive" | grep -Fx "$prefix/$required" >/dev/null; then
                echo "$archive is missing $required" >&2
                return 1
              fi
            done

            cmp -s "crates/$crate/LICENSE-MIT" LICENSE-MIT
            cmp -s "crates/$crate/LICENSE-APACHE" LICENSE-APACHE
            tar -xOf "$archive" "$prefix/LICENSE-MIT" | cmp -s - LICENSE-MIT
            tar -xOf "$archive" "$prefix/LICENSE-APACHE" | cmp -s - LICENSE-APACHE
          }

          check_package neoengram-core
          check_package neoengram

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run default-feature tests
        run: cargo test --workspace --all-targets --locked
      - name: Test the real Linux mount probe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mount_root="$(mktemp -d "${RUNNER_TEMP}/neoengram-mount-probe.XXXXXX")"
          cleanup() {
            local status=$?
            trap - EXIT INT TERM
            if mountpoint --quiet "$mount_root"; then
              sudo -n umount "$mount_root" || status=1
            fi
            rmdir "$mount_root" || status=1
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          sudo -n mount \
            --types tmpfs \
            --options "size=16m,mode=0770,uid=$(id -u),gid=$(id -g)" \
            neoengram-ci "$mount_root"
          printf 'neoengram-ci-volume\n' > \
            "$mount_root/.neoengram-volume-marker"

          NEOENGRAM_REAL_MOUNT_PROBE_ROOT="$mount_root" \
            cargo test --locked -p neoengram-agent \
              --test linux_mount_probe \
              detects_real_mount_boundary_and_read_write_capabilities \
              -- --ignored --exact

  test-all-features:
    name: Test all features (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run all-feature tests
        run: cargo test --workspace --all-targets --all-features --locked

  web-e2e:
    name: Vue Web E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/neoengram-web/package-lock.json
      - name: Install Web dependencies
        run: npm ci
        working-directory: apps/neoengram-web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/neoengram-web
      - name: Run Vue Web end-to-end tests
        run: npm run test:e2e
        working-directory: apps/neoengram-web

  msrv:
    name: Minimum Rust 1.97.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --all-features --locked
