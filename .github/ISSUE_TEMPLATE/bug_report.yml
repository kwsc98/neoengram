name: Bug report
description: 报告可复现的缺陷
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢你帮助改进 Synapse。安全漏洞请勿在此公开报告，请阅读 SECURITY.md。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰说明实际行为和期望行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小示例、命令和输入。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Synapse 版本或提交
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统，以及 rustc --version 的输出。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或补充信息
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 issue，确认没有相同报告。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
